<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ئەندازیارنامە — ئینسایکلۆپیدیای بەشە ئەندازیارییەکان</title>
  <meta name="description" content="ئینسایکلۆپیدیایەکی سادە و جێگیر بۆ هەموو بەشە ئەندازیارییەکان: چی دەخوێنن، کارەکانیان، لقەکان، ماستەر و دکتۆرا، نەرمەکاڵا، ڕەنگی کڵاو و سەلامەتی، و زیرەکترین ئەندازیارانی جیهان — بە کوردی، عەرەبی، ئینگلیزی و ئەڵمانی.">
  <meta name="theme-color" content="#03060d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 16 240 164'%3E%3Cpath fill='%23FFB81C' d='M16 126C16 112 60 104 120 104S224 112 224 126 176 152 120 152 16 140 16 126ZM36 124C36 70 72 28 120 28S204 70 204 124Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.pexels.com">
  <link rel="preconnect" href="https://en.wikipedia.org">
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Shared gradients & filters for every helmet on the page -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="hg-hi" x1="0" y1="0" x2=".85" y2=".95">
        <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
        <stop offset=".32" stop-color="#fff" stop-opacity=".16"/>
        <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="hg-sh" x1="0" y1="0" x2="1" y2="0">
        <stop offset=".5" stop-color="#000" stop-opacity="0"/>
        <stop offset=".82" stop-color="#000" stop-opacity=".22"/>
        <stop offset="1" stop-color="#000" stop-opacity=".5"/>
      </linearGradient>
      <radialGradient id="hg-side" cx=".38" cy=".3" r=".85">
        <stop offset=".45" stop-color="#000" stop-opacity="0"/>
        <stop offset=".85" stop-color="#000" stop-opacity=".26"/>
        <stop offset="1" stop-color="#000" stop-opacity=".48"/>
      </radialGradient>
      <linearGradient id="hg-brim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
        <stop offset=".42" stop-color="#fff" stop-opacity=".04"/>
        <stop offset=".7" stop-color="#000" stop-opacity=".12"/>
        <stop offset="1" stop-color="#000" stop-opacity=".42"/>
      </linearGradient>
      <linearGradient id="hg-edge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".22"/>
        <stop offset="1" stop-color="#000" stop-opacity=".62"/>
      </linearGradient>
      <linearGradient id="hg-rib" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
        <stop offset=".42" stop-color="#fff" stop-opacity=".1"/>
        <stop offset=".6" stop-color="#000" stop-opacity=".06"/>
        <stop offset="1" stop-color="#000" stop-opacity=".38"/>
      </linearGradient>
      <filter id="hg-blur" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="hg-soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
  </svg>

  <!-- Loader: a helmet drawn line by line -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-in">
      <svg viewBox="0 16 240 164">
        <path class="ld-fill" d="M36 124C36 70 72 28 120 28S204 70 204 124C180 134 60 134 36 124Z"/>
        <path class="ld-line" d="M16 126C16 112 60 104 120 104S224 112 224 126 176 152 120 152 16 140 16 126Z"/>
        <path class="ld-line l2" d="M36 124C36 70 72 28 120 28S204 70 204 124"/>
        <path class="ld-line l3" d="M109 31C105 46 104 58 106 72Q120 78 134 72C136 58 135 46 131 31"/>
      </svg>
      <p id="loaderText">کڵاوەکەت ئامادە دەکەین…</p>
      <div class="ld-bar"><i></i></div>
    </div>
  </div>

  <!-- Animated background -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grid-layer" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar" id="topbar"></header>

  <main id="home"></main>
  <main id="dept" class="dept" hidden></main>

  <footer class="footer" id="footer"></footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>

  <!-- Helmet drop when entering a department -->
  <div class="drop" id="drop" hidden>
    <div class="drop-veil"></div>
    <div class="drop-center">
      <svg class="drop-person" viewBox="0 0 220 230" aria-hidden="true">
        <circle cx="110" cy="112" r="44"/>
        <path d="M92 152v12M128 152v12M34 228c4-40 36-60 76-60s72 20 76 60"/>
        <path d="M96 118c8 8 20 8 28 0M94 100h.01M126 100h.01"/>
      </svg>
      <div class="drop-helmet"></div>
      <span class="drop-ring"></span>
      <div class="drop-sparks"></div>
      <p class="drop-title"></p>
      <p class="drop-sub"></p>
    </div>
  </div>

  <script src="assets/data/core.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/bg.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
