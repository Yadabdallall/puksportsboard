<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<title>PUK Sports Editorial</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { height: 100vh; width: 56.25vh; max-width: 100vw; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
/*
 * Vertical (9:16) 30 s film for the PUK Sports Board in an editorial poster
 * style: warm paper, ink black, red and the board's own green (#129901). Flat graphic illustrations of boxing, volleyball and table
 * tennis, giant outlined words and chapter numbers, and colour-block wipes on
 * the bar lines. It shares its timeline with trio3d.html, so audio/trio.py fits.
 * Layout is in 1080x1920 units; ?scale=1.5 renders 3K. renderFrame(t) is a
 * pure function of time.
 */
const W = 1080, H = 1920, DURATION = 30;
const SCALE = Number(new URLSearchParams(location.search).get('scale') || 1);
const BEAT = 60 / 96, BAR = 4 * BEAT; // 96 bpm, every chapter is two bars (5 s)

const C = {
  paper: '#efe9dd', paper2: '#e6dfd0', ink: '#141414', red: '#e2402c', redDark: '#b72f20',
  brand: '#129901', green: '#1d8a4c', greenDark: '#16653a', white: '#fbf8f2',
};

const CHAPTERS = [
  { word: 'بۆکسێن', label: 'بۆکسێن', text: ['هێز لە دڵەوە', 'دەست پێدەکات'], accent: 'دڵەوە', color: C.red },
  { word: 'ڕاهێنان', label: 'ڕاهێنان', text: ['ئارەقەی ئەمڕۆ،', 'سەرکەوتنی سبەینێیە'], accent: 'سەرکەوتنی', color: C.ink },
  { word: 'بالە', label: 'بالە', text: ['هەر خاڵێک،', 'بە یەکڕیزی دەبرێتەوە'], accent: 'یەکڕیزی', color: C.brand },
  { word: 'تێنس', label: 'تێنسی سەر مێز', text: ['خێرایی و هێمنی،', 'لە یەک کاتدا'], accent: 'هێمنی', color: C.green },
  { word: 'یەکڕیزی', label: 'یەکڕیزی', text: ['وەرزش،', 'شانازیی کوردستانە'], accent: 'کوردستانە', color: C.red },
];
const END = { title: 'بۆردی وەرزشی', sub: 'یەکێتیی نیشتمانیی کوردستان', line: 'هەمیشە لە پاڵتانین' };
const TEXT_IN = [1.6, 5.6, 10.6, 15.6, 20.6];
// the props' moments, shared with trio3d.html and audio/trio.py
const PUNCHES = [6.25, 7.5, 8.75];
const SET = 11.25, SPIKE = 12.5, LAND = 12.86;
const PP = Array.from({ length: 6 }, (_, i) => 16.25 + i * BEAT);
const STAMPS = [20.35, 20.663, 20.975];
const END_AT = 25.0, OUTRO = 29.35;

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inOut: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
  expo: u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u),
  expoInOut: u => u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2,
  in: u => u * u * u,
  back: u => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
  sine: u => 0.5 - 0.5 * Math.cos(Math.PI * u),
};
const chapterAt = t => clamp(Math.floor(t / (2 * BAR)), 0, 5);

const stage = document.getElementById('stage');
stage.width = W * SCALE;
stage.height = H * SCALE;
const ctx = stage.getContext('2d');

// ---------------------------------------------------------------- assets
const fontFaces = [['400', 'Zain-Regular.ttf'], ['700', 'Zain-Bold.ttf'], ['800', 'Zain-ExtraBold.ttf'], ['900', 'Zain-Black.ttf']]
  .map(([w, f]) => new FontFace('Zain', `url(assets/fonts/${f})`, { weight: w }));
fontFaces.forEach(f => document.fonts.add(f));
const logoImg = new Image();
logoImg.src = 'assets/logo.png';
let paperTex;
function makePaper() {
  // warm paper: soft fibres and fine speckle, made once
  const c = document.createElement('canvas');
  c.width = 540; c.height = 960;
  const g = c.getContext('2d');
  const d = g.createImageData(c.width, c.height);
  let s = 12345;
  const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 128 + (r() - 0.5) * 38;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  return c;
}

// ---------------------------------------------------------------- background
function paper(t) {
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(paperTex, 0, 0, W, H);
  ctx.restore();
  // a quiet 6-column grid
  ctx.save();
  ctx.strokeStyle = 'rgba(20,20,20,0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const x = i * W / 6;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.restore();
}

// the chapter word, huge and outlined, drifting across the page
function giantWord(t) {
  const i = chapterAt(t);
  if (i >= 5) return;
  const ch = CHAPTERS[i];
  const u = prog(t, i * 2 * BAR, (i + 1) * 2 * BAR);
  ctx.save();
  ctx.font = '900 520px Zain';
  ctx.direction = 'rtl';
  ctx.textAlign = 'center';
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(20,20,20,0.14)';
  const x = W / 2 + lerp(260, -260, u);
  ctx.strokeText(ch.word, x, 1040);
  ctx.restore();
}

function chrome(t) {
  const i = chapterAt(t);
  const a = Math.min(prog(t, 0.5, 1.2), 1 - prog(t, END_AT - 0.3, END_AT));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = C.ink;
  // top rule with the chapter counter and the board's name
  ctx.fillRect(60, 120, W - 120, 3);
  ctx.font = '700 30px Zain';
  ctx.direction = 'ltr';
  ctx.textAlign = 'left';
  ctx.letterSpacing = '6px';
  ctx.fillText('PUK SPORTS BOARD', 60, 100);
  ctx.textAlign = 'right';
  ctx.fillText(`${String(Math.min(i + 1, 5)).padStart(2, '0')} / 05`, W - 60, 100);
  ctx.letterSpacing = '0px';
  // bottom signature
  ctx.drawImage(logoImg, 60, 1770, 86, 86);
  ctx.font = '800 34px Zain';
  ctx.direction = 'rtl';
  ctx.textAlign = 'left';
  ctx.fillText('بۆردی وەرزشی', 162, 1826);
  ctx.fillRect(60, 1745, W - 120, 3);
  ctx.restore();
}

// the big outlined chapter number, sliding in at each chapter
function chapterNumber(t) {
  const i = chapterAt(t);
  if (i >= 5) return;
  const t0 = i * 2 * BAR;
  const u = ease.expo(prog(t, t0 + 0.15, t0 + 0.9));
  ctx.save();
  ctx.font = '900 210px Zain';
  ctx.direction = 'ltr';
  ctx.textAlign = 'left';
  ctx.lineWidth = 4;
  ctx.strokeStyle = C.ink;
  ctx.globalAlpha = u;
  ctx.strokeText(String(i + 1).padStart(2, '0'), 60 - (1 - u) * 80, 330);
  ctx.restore();
  // the sport's name, a solid tag beside the number
  const lu = ease.expo(prog(t, t0 + 0.35, t0 + 1.0));
  if (lu <= 0) return;
  const ch = CHAPTERS[i];
  ctx.save();
  ctx.font = '900 54px Zain';
  ctx.direction = 'rtl';
  const tw = ctx.measureText(ch.label).width;
  const x1 = W - 60, h = 84, y = 214;
  ctx.fillStyle = ch.color;
  ctx.fillRect(x1 - (tw + 56) * lu, y, (tw + 56) * lu, h);
  ctx.beginPath();
  ctx.rect(x1 - (tw + 56) * lu, y, (tw + 56) * lu, h);
  ctx.clip();
  ctx.fillStyle = C.white;
  ctx.textAlign = 'right';
  ctx.fillText(ch.label, x1 - 28, y + 60);
  ctx.restore();
}

// ---------------------------------------------------------------- illustrations
// Each is drawn in its own coordinates around the illustration's centre.
const CX = 540, CY = 800;

function glovePath(g) {
  // a boxing glove, fist up, cuff down, about 300 units tall
  g.beginPath();
  g.moveTo(-74, 70);
  g.bezierCurveTo(-96, 10, -112, -70, -96, -122);
  g.bezierCurveTo(-82, -176, -30, -196, 8, -192);
  g.bezierCurveTo(60, -188, 100, -160, 104, -104);
  g.bezierCurveTo(106, -60, 96, -10, 78, 70);
  g.closePath();
}
function drawGlove(x, y, rot, s = 1, col = C.red, dark = C.redDark, stripe = col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s, s);
  // shadow block, offset like a print misregistration
  ctx.save();
  ctx.translate(12, 12);
  glovePath(ctx);
  ctx.fillStyle = 'rgba(20,20,20,0.16)';
  ctx.fill();
  ctx.restore();
  glovePath(ctx);
  ctx.fillStyle = col;
  ctx.fill();
  // thumb
  ctx.beginPath();
  ctx.ellipse(92, -28, 34, 70, -0.2, 0, Math.PI * 2);
  ctx.fillStyle = dark;
  ctx.fill();
  // knuckle line and highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, -96, 70, -2.6, -1.2);
  ctx.stroke();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-80, -40); ctx.quadraticCurveTo(0, -20, 70, -46);
  ctx.stroke();
  // cuff with a stripe
  ctx.fillStyle = C.white;
  ctx.beginPath();
  ctx.roundRect(-80, 56, 162, 104, 14);
  ctx.fill();
  ctx.fillStyle = stripe;
  ctx.fillRect(-80, 92, 162, 24);
  ctx.restore();
}

// 1. a pair of gloves hanging from a peg, swaying
function sceneGloves(t) {
  const a = prog(t, 0.2, 1.0);
  const peg = { x: CX, y: 360 };
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = C.ink;
  ctx.fillRect(peg.x - 170, peg.y - 14, 340, 28);
  [[-1, 1.1], [1, 0.0]].forEach(([side, ph]) => {
    const sw = Math.sin(t * 1.4 + ph) * 0.09;
    const len = 330 + (side > 0 ? 70 : 0);
    const ax = peg.x + side * 95, ay = peg.y + 10;
    const gx = ax + Math.sin(sw) * len, gy = ay + Math.cos(sw) * len;
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(gx - 20, gy - 10); ctx.moveTo(ax, ay); ctx.lineTo(gx + 20, gy - 10); ctx.stroke();
    const drop = (1 - ease.back(prog(t, 0.3 + (side > 0 ? 0.25 : 0), 1.2 + (side > 0 ? 0.25 : 0)))) * 600;
    drawGlove(gx, gy + 150 - drop, Math.PI - sw * 1.2, 0.95, side > 0 ? C.red : C.ink, side > 0 ? C.redDark : '#2b2b2b');
  });
  ctx.restore();
}

// 2. a glove strikes a heavy bag on the beat
function sceneBag(t) {
  const pivot = { x: CX + 120, y: 260 };
  let ang = 0;
  for (const h of PUNCHES) if (t > h) ang += 0.2 * Math.exp(-(t - h) * 1.2) * Math.sin((t - h) * 3.6);
  const enter = ease.expo(prog(t, 4.9, 5.6));
  ctx.save();
  ctx.translate(0, (1 - enter) * -900);
  // chain and bag
  ctx.translate(pivot.x, pivot.y);
  ctx.rotate(-ang);
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 120); ctx.stroke();
  ctx.fillStyle = 'rgba(20,20,20,0.16)';
  ctx.beginPath(); ctx.roundRect(-110 + 14, 120 + 14, 220, 560, 110); ctx.fill();
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.roundRect(-110, 120, 220, 560, 110); ctx.fill();
  ctx.fillStyle = C.red;
  ctx.fillRect(-110, 230, 220, 30);
  ctx.fillRect(-110, 560, 220, 30);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.roundRect(-80, 150, 36, 500, 18); ctx.fill();
  ctx.restore();
  // the glove: wind back, strike, recoil
  const h = PUNCHES.find(x => t < x + 0.6) ?? PUNCHES[PUNCHES.length - 1];
  const k = t - h;
  const reach = k < -0.35 ? 0 : k < 0 ? ease.in(prog(k, -0.35, 0)) : 1 - ease.out(prog(k, 0, 0.5));
  const gx = lerp(-160, pivot.x - 300, reach), gy = 700;
  drawGlove(gx, gy, Math.PI / 2, 0.9 * (1 + 0.08 * reach), C.red, C.redDark);
  // speed lines behind the glove while it travels
  if (reach > 0.05 && reach < 0.98 && k < 0) {
    ctx.save();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    for (let j = 0; j < 4; j++) {
      const y = gy - 90 + j * 60;
      ctx.beginPath(); ctx.moveTo(gx - 240 - j * 30, y); ctx.lineTo(gx - 160 - j * 20, y); ctx.stroke();
    }
    ctx.restore();
  }
  // impact burst in the board's green
  const bu = prog(t, h, h + 0.35);
  if (bu > 0 && bu < 1) {
    const cx = pivot.x - 120, cy = gy - 10;
    ctx.save();
    ctx.strokeStyle = C.brand;
    ctx.lineWidth = 12 * (1 - bu) + 2;
    ctx.lineCap = 'round';
    for (let j = 0; j < 10; j++) {
      const a2 = -Math.PI * 0.85 + j * (Math.PI * 1.7 / 9);
      const r0 = 60 + 120 * ease.out(bu), r1 = r0 + 70 * (1 - bu);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a2) * r0, cy + Math.sin(a2) * r0);
      ctx.lineTo(cx + Math.cos(a2) * r1, cy + Math.sin(a2) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawVolleyball(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(20,20,20,0.16)';
  ctx.beginPath(); ctx.arc(10, 10, r, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = C.brand;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.rotate(rot);
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.95, r * 1.1, r * 0.55, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.red;
  ctx.beginPath(); ctx.ellipse(r * 0.75, r * 0.65, r * 0.75, r * 0.5, -0.9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = r * 0.06;
  for (const k of [-0.35, 0.05, 0.45]) {
    ctx.beginPath(); ctx.arc(-r * 1.6, r * 1.2, r * (2.1 + k), -1.2, -0.1); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = r * 0.06;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// 3. a volleyball is set and spiked over the net
function sceneVolley(t) {
  const enter = ease.expo(prog(t, 9.9, 10.6));
  const floorY = 1130;
  ctx.save();
  ctx.globalAlpha = enter;
  // floor line and the net, in ink
  ctx.fillStyle = C.ink;
  ctx.fillRect(60, floorY, W - 120, 6);
  const nx = CX, top = 560, nh = 230, dx = 110, dy = 70; // near end lower-left, far end upper-right
  const P = (u, v) => ({ x: nx - dx + 2 * dx * u, y: top + dy - 2 * dy * u + nh * v });
  ctx.strokeStyle = 'rgba(20,20,20,0.7)';
  ctx.lineWidth = 2;
  for (let k = 0; k <= 10; k++) { const a = P(k / 10, 0), b = P(k / 10, 1); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  for (let k = 0; k <= 9; k++) { const a = P(0, k / 9), b = P(1, k / 9); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  // white top band
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 14;
  ctx.beginPath(); ctx.moveTo(P(0, 0).x, P(0, 0).y); ctx.lineTo(P(1, 0).x, P(1, 0).y); ctx.stroke();
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2;
  ctx.stroke();
  // posts down to the floor
  ctx.fillStyle = C.ink;
  ctx.fillRect(P(0, 0).x - 7, P(0, 0).y - 20, 14, floorY - P(0, 0).y + 20);
  ctx.fillRect(P(1, 0).x - 6, P(1, 0).y - 20, 12, floorY - 40 - P(1, 0).y + 20);
  ctx.restore();
  // the ball's path, drawn as a dotted line just ahead of it
  const A = { x: 200, y: 900 }, TOP = { x: 330, y: 330 }, L = { x: 870, y: floorY - 64 };
  let p;
  if (t < SET) p = { x: A.x, y: A.y + Math.sin(t * 2.4) * 20 };
  else if (t < SPIKE) { const u = prog(t, SET, SPIKE); p = { x: lerp(A.x, TOP.x, u), y: lerp(A.y, TOP.y, Math.sin(u * Math.PI / 2)) }; }
  else if (t < LAND) { const u = prog(t, SPIKE, LAND); p = { x: lerp(TOP.x, L.x, u), y: lerp(TOP.y, L.y, u * u * 0.4 + u * 0.6) }; }
  else { const k = t - LAND; p = { x: L.x + k * 90, y: L.y - Math.abs(Math.sin(k * 4.6)) * 260 * Math.exp(-k * 1.5) }; }
  // spike trail: long ink streaks from the hit to the floor
  const su = prog(t, SPIKE, LAND + 0.4);
  if (su > 0 && su < 1) {
    ctx.save();
    ctx.strokeStyle = C.ink;
    ctx.lineCap = 'round';
    for (let j = -1; j <= 1; j++) {
      ctx.lineWidth = 8 - Math.abs(j) * 3;
      ctx.globalAlpha = 1 - su;
      ctx.beginPath();
      ctx.moveTo(TOP.x + j * 26, TOP.y - j * 10);
      ctx.lineTo(lerp(TOP.x, p.x, 0.85) + j * 26, lerp(TOP.y, p.y, 0.85) - j * 10);
      ctx.stroke();
    }
    ctx.restore();
  }
  // impact rings on the floor
  const ru = prog(t, LAND, LAND + 0.8);
  if (ru > 0 && ru < 1) {
    ctx.save();
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 6 * (1 - ru) + 1;
    ctx.beginPath(); ctx.ellipse(L.x, floorY, 60 + 200 * ease.out(ru), 16 + 40 * ease.out(ru), 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  if (enter > 0) drawVolleyball(p.x, p.y, 64, t * 2.2);
}

function drawPaddle(x, y, rot, face, s = 0.82) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(20,20,20,0.18)';
  ctx.beginPath(); ctx.arc(8, 8, 62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c99a62';
  ctx.beginPath(); ctx.roundRect(-16, 50, 32, 96, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2);
  ctx.fillStyle = face;
  ctx.fill();
  ctx.strokeStyle = '#c99a62';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.restore();
}

// 4. table tennis, seen from above: a rally on every beat
function sceneTable(t) {
  const enter = ease.expo(prog(t, 14.9, 15.6));
  const tw = 480, th = 780, tx = CX - tw / 2, ty = 440;
  ctx.save();
  ctx.translate(0, (1 - enter) * 1400);
  ctx.fillStyle = 'rgba(20,20,20,0.16)';
  ctx.fillRect(tx + 16, ty + 16, tw, th);
  ctx.fillStyle = C.green;
  ctx.fillRect(tx, ty, tw, th);
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 8;
  ctx.strokeRect(tx + 4, ty + 4, tw - 8, th - 8);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(CX, ty); ctx.lineTo(CX, ty + th); ctx.stroke();
  ctx.fillStyle = C.ink;
  ctx.fillRect(tx - 30, ty + th / 2 - 7, tw + 60, 14);
  // the ball travels between the two ends, bouncing once on the far half
  const ends = i => ({ x: CX + (i % 2 ? 120 : -110), y: i % 2 ? ty + 40 : ty + th - 40 });
  let i = PP.findIndex(h => t < h) - 1;
  let p, sz = 1;
  if (t < PP[0]) { const e = ends(0); p = { x: e.x, y: e.y + 60 }; }
  else if (i < 0 || i >= PP.length - 1) {
    const e = ends(PP.length - 1), k = t - PP[PP.length - 1];
    p = { x: e.x, y: e.y + k * 1300 };
  } else {
    const a = ends(i), b = ends(i + 1), u = prog(t, PP[i], PP[i + 1]);
    p = { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) };
    // height, shown as size: up over the net, down to the bounce, up to the bat
    const ub = 0.62;
    sz = 1 + (u < ub ? Math.sin(u / ub * Math.PI) * 0.6 : Math.sin((u - ub) / (1 - ub) * Math.PI) * 0.35);
    // dotted trail
    ctx.fillStyle = 'rgba(251,248,242,0.75)';
    for (let k = 1; k <= 8; k++) {
      const v = u - k * 0.03;
      if (v < 0) break;
      ctx.beginPath(); ctx.arc(lerp(a.x, b.x, v), lerp(a.y, b.y, v), 5, 0, Math.PI * 2); ctx.fill();
    }
  }
  // bats at each end, swinging into each hit
  [0, 1].forEach(side => {
    const near = PP.filter((_, k) => k % 2 === side);
    const hh = near.reduce((best, x) => Math.abs(t - x) < Math.abs(t - best) ? x : best, near[0]);
    const sw = Math.exp(-(((t - hh) / 0.13) ** 2));
    const e = ends(side);
    drawPaddle(lerp(e.x + (side ? 60 : -60), p.x, 0.5), side ? ty - 56 + 30 * sw : ty + th + 56 - 30 * sw,
      (side ? Math.PI : 0) + (side ? -1 : 1) * (0.5 - 0.6 * sw), side ? C.ink : C.red);
  });
  ctx.fillStyle = 'rgba(20,20,20,0.25)';
  ctx.beginPath(); ctx.arc(p.x + 10 * sz, p.y + 12 * sz, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.white;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(p.x, p.y, 13 * sz, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// 5. three stamped badges: glove, volleyball, bat
function sceneBadges(t) {
  const spots = [{ x: 330, y: 560, c: C.red }, { x: 740, y: 760, c: C.brand }, { x: 360, y: 1000, c: C.ink }];
  spots.forEach((s, i) => {
    const u = prog(t, STAMPS[i] - 0.25, STAMPS[i] + 0.35);
    if (u <= 0) return;
    const sc = u < 0.42 ? lerp(1.6, 0.94, ease.in(u / 0.42)) : lerp(0.94, 1, ease.out((u - 0.42) / 0.58));
    ctx.save();
    ctx.translate(s.x, s.y + Math.sin(t * 1.5 + i) * 6);
    ctx.rotate((i - 1) * 0.12 + (1 - u) * 0.3);
    ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(u * 3);
    ctx.fillStyle = 'rgba(20,20,20,0.16)';
    ctx.beginPath(); ctx.arc(12, 12, 170, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(0, 0, 170, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.arc(0, 0, 148, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    if (i === 0) drawGlove(0, 10, 0.25, 0.6, C.white, '#ddd2bf', C.ink);
    if (i === 1) drawVolleyball(0, 0, 80, t * 0.6);
    if (i === 2) { drawPaddle(-10, -10, -0.5, C.red, 1); ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(70, -70, 16, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  });
}

// ---------------------------------------------------------------- type
// Words slide in from the right (reading order); the accent word gets a
// green tag swept in behind it, turning it white with a soft glow.
function phrase(t, i) {
  const ch = CHAPTERS[i], t0 = TEXT_IN[i], t1 = (i + 1) * 2 * BAR - 0.3;
  if (t < t0 || t > t1 + 0.1) return;
  const out = ease.in(prog(t, t1 - 0.4, t1));
  ch.text.forEach((line, k) => {
    const size = 104, y = 1480 + k * 128;
    ctx.save();
    ctx.font = `900 ${size}px Zain`;
    ctx.direction = 'rtl';
    ctx.textAlign = 'right';
    const words = line.split(' ');
    const ws = words.map(w => ctx.measureText(w).width);
    const sp = ctx.measureText(' ').width;
    const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
    const fit = Math.min(1, (W - 120) / total);
    ctx.translate(W - 60, y);
    ctx.scale(fit, fit);
    let xr = 0;
    words.forEach((w, j) => {
      const d = t0 + k * 0.22 + j * 0.09;
      const u = ease.expo(prog(t, d, d + 0.6));
      if (u > 0) {
        const isAccent = w.replace(/[،,.]/g, '') === ch.accent;
        ctx.save();
        ctx.globalAlpha = u * (1 - out);
        ctx.translate((1 - u) * 60 + out * -40, 0);
        ctx.fillStyle = isAccent ? C.red : C.ink;
        ctx.fillText(w, xr, 0);
        if (isAccent) {
          const hu = ease.expoInOut(prog(t, d + 0.25, d + 0.85));
          const bx = xr + 14 - (ws[j] + 28) * hu, bw = (ws[j] + 28) * hu;
          ctx.fillStyle = C.brand;
          ctx.fillRect(bx, -size * 0.8, bw, size * 1.06);
          ctx.beginPath();
          ctx.rect(bx, -size * 0.8, bw, size * 1.06);
          ctx.clip();
          ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
          ctx.shadowBlur = 14 * SCALE;
          ctx.fillStyle = C.white;
          ctx.fillText(w, xr, 0);
        }
        ctx.restore();
      }
      xr -= ws[j] + sp;
    });
    ctx.restore();
  });
}

// ---------------------------------------------------------------- transitions
// colour-block wipes on the bar lines: a band of the next chapter's colour
// crosses the page, then ink, then the page is clean again
function wipe(t) {
  for (let i = 1; i <= 5; i++) {
    const c = i * 2 * BAR;
    const u = prog(t, c - 0.45, c + 0.45);
    if (u <= 0 || u >= 1) continue;
    const col = i < 5 ? CHAPTERS[i].color : C.red;
    const bands = [[col, 0], [C.ink, 0.12], [C.brand, 0.22]];
    for (const [cl, off] of bands) {
      const v = clamp((u - off) / (1 - 0.22));
      const a = ease.expoInOut(clamp(v * 2)), b = ease.expoInOut(clamp(v * 2 - 1));
      ctx.fillStyle = cl;
      ctx.fillRect(W * (1 - a) - 1, 0, W * (a - b) + 2, H);
    }
  }
}

// ---------------------------------------------------------------- end card
function endCard(t) {
  if (t < END_AT) return;
  const u = prog(t, END_AT + 0.2, END_AT + 1.4);
  // a 21-ray sun in the board's green, turning slowly behind the logo
  ctx.save();
  ctx.translate(CX, 780);
  ctx.rotate(t * 0.12);
  const rays = 21, R0 = 250, R1 = 250 + 330 * ease.expo(u);
  ctx.fillStyle = C.brand;
  for (let k = 0; k < rays; k++) {
    const a = k / rays * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.07) * R0, Math.sin(a - 0.07) * R0);
    ctx.lineTo(Math.cos(a) * R1, Math.sin(a) * R1);
    ctx.lineTo(Math.cos(a + 0.07) * R0, Math.sin(a + 0.07) * R0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(CX, 780, 248, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ease.expoInOut(prog(t, END_AT + 0.4, END_AT + 1.5))); ctx.stroke();
  const lu = prog(t, END_AT + 0.6, END_AT + 1.3);
  if (lu > 0) {
    const s = 470 * lerp(0.7, 1, ease.back(lu));
    ctx.globalAlpha = clamp(lu * 2);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(logoImg, CX - s / 2, 780 - s / 2, s, s);
  }
  ctx.restore();
  const lines = [[END.title, 1300, 120, 900, C.ink, END_AT + 1.0], [END.sub, 1410, 64, 800, C.ink, END_AT + 1.25], [END.line, 1560, 70, 900, C.red, END_AT + 1.7]];
  for (const [txt, y, size, weight, color, t0] of lines) {
    const v = ease.expo(prog(t, t0, t0 + 0.8));
    if (v <= 0) continue;
    ctx.save();
    ctx.font = `${weight} ${size}px Zain`;
    ctx.direction = 'rtl';
    ctx.textAlign = 'center';
    ctx.globalAlpha = v;
    ctx.fillStyle = color;
    ctx.fillText(txt, CX + (1 - v) * 50, y);
    if (color === C.red) {
      const tw = ctx.measureText(txt).width;
      const hw = (tw + 56) * ease.expoInOut(prog(t, t0 + 0.2, t0 + 0.9));
      const bx = CX + tw / 2 + 28 - hw;
      ctx.fillStyle = C.brand;
      ctx.fillRect(bx, y - size * 0.82, hw, size * 1.1);
      ctx.beginPath();
      ctx.rect(bx, y - size * 0.82, hw, size * 1.1);
      ctx.clip();
      ctx.fillStyle = C.white;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
      ctx.shadowBlur = 14 * SCALE;
      ctx.fillText(txt, CX + (1 - v) * 50, y);
    }
    ctx.restore();
  }
  const ru = ease.expoInOut(prog(t, END_AT + 1.4, END_AT + 2.1));
  if (ru > 0) { ctx.fillStyle = C.ink; ctx.fillRect(CX - 120 * ru, 1460, 240 * ru, 4); }
}

// ---------------------------------------------------------------- frame
function renderFrame(t) {
  ctx.save();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  ctx.lineCap = 'butt';
  paper(t);
  giantWord(t);
  const i = chapterAt(t);
  if (i === 0) sceneGloves(t);
  if (i === 1) sceneBag(t);
  if (i === 2) sceneVolley(t);
  if (i === 3) sceneTable(t);
  if (i === 4) sceneBadges(t);
  if (i < 5) phrase(t, i);
  chapterNumber(t);
  endCard(t);
  chrome(t);
  wipe(t);
  const fade = Math.max(1 - ease.out(prog(t, 0, 0.5)), ease.inOut(prog(t, OUTRO, DURATION)));
  if (fade > 0) {
    ctx.fillStyle = `rgba(239, 233, 221, ${fade})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

window.ready = Promise.all([...fontFaces.map(f => f.load()), logoImg.decode()]).then(() => {
  paperTex = makePaper();
  return true;
});
window.renderFrame = renderFrame;
window.DURATION = DURATION;
// the same cues as trio3d.html, so audio/trio.py lines up
window.soundCues = () => ({
  duration: DURATION, bpm: 96,
  punches: PUNCHES, spike: SPIKE, spikeLand: LAND,
  ppHits: PP.map(x => +x.toFixed(3)), ppBounces: PP.slice(0, -1).map(h => +(h + BEAT * 0.62).toFixed(3)),
  pedestals: STAMPS,
  cuts: [4.8, 9.8, 14.8, 19.8],
  wipe: END_AT,
  phrases: TEXT_IN,
  logo: END_AT + 1.1, outro: OUTRO,
});

if (!location.search.includes('capture')) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = now => { renderFrame(((now - start) / 1000) % (DURATION + 0.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
