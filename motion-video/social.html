<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<title>PUK Sports Board · Follow us</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { height: 100vh; width: 56.25vh; max-width: 100vw; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
/*
 * A 30 s vertical (9:16) "follow us" film for the PUK Sports Board's
 * accounts on Facebook, Instagram and TikTok, all named PUK SPORTS BOARD.
 * Black, dark green and light green. The background is calm and luminous:
 * a slow green aurora, two bundles of thin neon lines flowing like silk,
 * soft bokeh lights and a few sparks. The cards are glass, lit from the
 * top left, and a light passes over them now and then.
 *
 *    0 –  5 s  the logo inside a neon halo, PUK SPORTS BOARD letter by letter
 *    5 – 10 s  «فۆڵۆمان بکەن» and the three platforms
 *   10 – 25 s  one platform every 5 s: its icon, name, the account, and a
 *              follow button that gets tapped on the bar line
 *   25 – 30 s  the logo with the three icons around it, «هەمیشە پشتیوانتانین»
 *
 * 96 bpm (a bar is 2.5 s); audio/social.py writes the music to the same bars
 * and the cues from window.soundCues(). Layout is in 1080x1920 units;
 * ?scale=2 renders 4K. renderFrame(t) is a pure function of time.
 */
const W = 1080, H = 1920, DURATION = 30;
const SCALE = Number(new URLSearchParams(location.search).get('scale') || 1);
const BEAT = 0.625, BAR = 2.5;

const C = {
  black: '#020503', deep: '#04160b', dark: '#0b3d1c', mid: '#137a36',
  light: '#9ef58a', neon: '#5dff73', mint: '#e8fbe3', ink: '#03130a',
};
const PLATFORMS = [
  { id: 'facebook', en: 'FACEBOOK', ku: 'فەیسبووک', line: 'هەواڵ و چالاکییەکانی بۆرد' },
  { id: 'instagram', en: 'INSTAGRAM', ku: 'ئینستاگرام', line: 'وێنە و ساتە جوانەکانی وەرزش' },
  { id: 'tiktok', en: 'TIKTOK', ku: 'تیکتۆک', line: 'ڤیدیۆی کورت و خێرا' },
];
const NAME = 'PUK SPORTS BOARD';
const TITLE_AT = 5, P0 = 10, PLEN = 5, END_AT = 25, OUTRO = 29.2;
const TAP = PLATFORMS.map((_, i) => P0 + i * PLEN + BAR);   // on the second bar line of each platform
const POPS = [6.25, 6.875, 7.5];                              // the three icons in the title, on the beat
const CUTS = [TITLE_AT, ...PLATFORMS.map((_, i) => P0 + i * PLEN), END_AT];

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  inOut: u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  expo: u => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
  back: u => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const rand = seed => { let s = seed % 2147483647 || 1; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; };
// how strongly the current beat is felt (1 on the beat, fading), once the groove has started
const beatPulse = t => (t < TITLE_AT ? 0 : Math.exp(-((t - TITLE_AT) % BEAT) * 6));

const stage = document.getElementById('stage');
stage.width = W * SCALE;
stage.height = H * SCALE;
const ctx = stage.getContext('2d');
// low-resolution layers: the soft background, and the neon drawn thick then blurred for its glow
const GW = Math.round((W * SCALE) / 4), GH = Math.round((H * SCALE) / 4);
const bgc = new OffscreenCanvas(GW, GH), bg = bgc.getContext('2d');
const glowA = new OffscreenCanvas(GW, GH), glowB = new OffscreenCanvas(GW, GH);
const ga = glowA.getContext('2d'), gb = glowB.getContext('2d');

const font = (weight, size) => `${weight} ${size}px Zain`;
function text(str, x, y, { size = 40, weight = 800, color = C.mint, align = 'center', dir = 'rtl', ls = 0, alpha = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = font(weight, size);
  ctx.direction = dir;
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.globalAlpha *= alpha;
  if (ls) ctx.letterSpacing = `${ls}px`;
  // centred letter-spaced text carries one extra space at its end
  ctx.fillText(str, x + (ls && align === 'center' ? ls / 2 : 0), y);
  ctx.restore();
}
function measure(str, size, weight = 800, ls = 0) {
  ctx.save(); ctx.font = font(weight, size); ctx.letterSpacing = `${ls}px`;
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
// text that rises into place from behind a line
function riseText(str, x, y, u, opts) {
  if (u <= 0) return;
  const size = opts.size || 40;
  ctx.save();
  ctx.beginPath(); ctx.rect(x - W, y - size * 1.3, W * 2, size * 1.95); ctx.clip();
  text(str, x, y + (1 - ease.expo(u)) * size * 1.8, opts);
  ctx.restore();
}
// text that fades up a little
function fadeUp(str, x, y, u, opts) {
  if (u <= 0) return;
  text(str, x, y + (1 - ease.out(u)) * 24, { ...opts, alpha: (opts.alpha ?? 1) * ease.out(u) });
}

// ---------------------------------------------------------------- assets
const fontFaces = [['400', 'Zain-Regular.ttf'], ['700', 'Zain-Bold.ttf'], ['800', 'Zain-ExtraBold.ttf'], ['900', 'Zain-Black.ttf']]
  .map(([w, f]) => new FontFace('Zain', `url(assets/fonts/${f})`, { weight: w }));
fontFaces.forEach(f => document.fonts.add(f));
const logoImg = new Image();
logoImg.src = 'assets/logo.png';

// ---------------------------------------------------------------- platform icons
// The official marks as white masks (assets/icons/make_icons.py), tinted in the film's greens.
const ICON_IDS = PLATFORMS.map(p => p.id);
const iconImgs = Object.fromEntries(ICON_IDS.map(id => { const im = new Image(); im.src = `assets/icons/${id}.png`; return [id, im]; }));
// the drawn size, as a multiple of r, so the marks look equally large
const ICON_SIZE = { facebook: 1.8, instagram: 1.86, tiktok: 1.9 };
const tinted = new Map();
function tintedIcon(id, fg) {
  const key = `${id}|${fg}`;
  if (!tinted.has(key)) {
    const im = iconImgs[id], n = im.naturalWidth;
    const c = new OffscreenCanvas(n, n), g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-in';
    // a gentle diagonal light across every mark; Instagram keeps its stronger gradient, in greens
    const gr = g.createLinearGradient(0, n, n, 0);
    if (id === 'instagram') { gr.addColorStop(0, C.mint); gr.addColorStop(0.5, fg); gr.addColorStop(1, C.neon); }
    else { gr.addColorStop(0, fg); gr.addColorStop(1, C.mint); }
    g.fillStyle = gr;
    g.fillRect(0, 0, n, n);
    tinted.set(key, c);
  }
  return tinted.get(key);
}
function icon(id, x, y, r, fg = C.light) {
  const s = ICON_SIZE[id] * r;
  ctx.save();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tintedIcon(id, fg), x - s / 2, y - s / 2, s, s);
  ctx.restore();
}

// ---------------------------------------------------------------- background
// large soft lights drifting slowly
const AURORA = [
  { x: 240, y: 560, r: 820, c: '19,122,54', a: 0.32, f: 0.05, ph: 0 },
  { x: 880, y: 1260, r: 900, c: '11,61,28', a: 0.5, f: 0.04, ph: 2.1 },
  { x: 560, y: 1780, r: 700, c: '93,255,115', a: 0.11, f: 0.06, ph: 4.2 },
  { x: 760, y: 180, r: 620, c: '158,245,138', a: 0.12, f: 0.045, ph: 1.3 },
];
const BOKEH = (() => { const r = rand(31); return Array.from({ length: 34 }, () => ({ x: r() * W, y: r() * H, s: 18 + r() ** 2 * 110, v: 6 + r() * 16, ph: r() * 6.28, a: 0.05 + r() * 0.16 })); })();
const SPARKS = (() => { const r = rand(7); return Array.from({ length: 40 }, () => ({ x: r() * W, y: r() * H, s: 1.2 + r() * 2.2, v: 14 + r() * 30, ph: r() * 6.28 })); })();
let dot;  // a soft round sprite for the bokeh
// two bundles of thin lines that flow across the screen like silk
const SILK = [
  { y: 1700, tilt: -0.16, amp: 70, spread: 120, k: 0.0042, w: 0.35, ph: 0, n: 26 },
  { y: 250, tilt: 0.12, amp: 55, spread: 90, k: 0.0051, w: -0.28, ph: 2, n: 20 },
];
function silk(g, t, sharp) {
  const pulse = beatPulse(t);
  g.save();
  g.lineCap = 'round';
  for (const b of SILK) {
    for (let i = 0; i < b.n; i++) {
      const v = i / (b.n - 1) - 0.5;
      const core = 1 - Math.abs(v) * 1.6;
      g.beginPath();
      for (let s = 0; s <= 48; s++) {
        const x = -60 + (W + 120) * s / 48;
        const sp = b.spread * (0.55 + 0.45 * Math.sin(x * 0.0031 + t * 0.4 + b.ph));
        const y = b.y + (x - 540) * b.tilt + b.amp * Math.sin(x * b.k + t * b.w + b.ph + v * 0.9)
          + 0.4 * b.amp * Math.sin(x * b.k * 2.3 - t * b.w * 1.3 + b.ph * 2) + v * sp;
        s ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      const gr = g.createLinearGradient(0, 0, W, 0);
      gr.addColorStop(0, 'rgba(93,255,115,0)'); gr.addColorStop(0.3, C.neon); gr.addColorStop(0.7, C.light); gr.addColorStop(1, 'rgba(158,245,138,0)');
      g.strokeStyle = gr;
      g.globalAlpha = clamp(core) * (sharp ? 0.55 : 0.5) * (0.85 + 0.15 * pulse);
      g.lineWidth = sharp ? 1.4 + core : 5;
      g.stroke();
    }
  }
  g.restore();
}
// a thin neon ring with a bright comet running round it, behind the main element
function halo(g, t, cx, cy, r, alpha, sharp) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = alpha;
  const rr = r * (1 + 0.015 * beatPulse(t));
  if (!sharp) {  // a soft disc of light
    const d = g.createRadialGradient(cx, cy, rr * 0.4, cx, cy, rr * 1.25);
    d.addColorStop(0, 'rgba(93,255,115,0.22)'); d.addColorStop(1, 'rgba(93,255,115,0)');
    g.fillStyle = d;
    g.fillRect(cx - rr * 1.3, cy - rr * 1.3, rr * 2.6, rr * 2.6);
  }
  g.strokeStyle = 'rgba(158,245,138,0.35)';
  g.lineWidth = sharp ? 1.5 : 4;
  g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI * 2); g.stroke();
  const a0 = t * 1.3;
  const cg = g.createConicGradient(a0, cx, cy);
  cg.addColorStop(0, 'rgba(93,255,115,0)'); cg.addColorStop(0.7, 'rgba(93,255,115,0)');
  cg.addColorStop(0.97, C.mint); cg.addColorStop(1, 'rgba(93,255,115,0)');
  g.strokeStyle = cg;
  g.lineWidth = sharp ? 4 : 12;
  g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI * 2); g.stroke();
  // a second, wider ring, very faint
  g.strokeStyle = 'rgba(158,245,138,0.12)';
  g.lineWidth = sharp ? 1.2 : 3;
  g.beginPath(); g.arc(cx, cy, rr * 1.18, 0, Math.PI * 2); g.stroke();
  g.restore();
}
function background(t, haloAt) {
  // the soft part, painted small: base, aurora, bokeh
  bg.setTransform(GW / W, 0, 0, GH / H, 0, 0);
  const base = bg.createRadialGradient(540, 900, 50, 540, 960, 1300);
  base.addColorStop(0, '#071f0f'); base.addColorStop(0.45, '#031009'); base.addColorStop(1, C.black);
  bg.fillStyle = base;
  bg.fillRect(0, 0, W, H);
  bg.globalCompositeOperation = 'lighter';
  for (const a of AURORA) {
    const x = a.x + 150 * Math.sin(t * a.f * 6.28 + a.ph), y = a.y + 110 * Math.cos(t * a.f * 5.1 + a.ph);
    const g = bg.createRadialGradient(x, y, 0, x, y, a.r);
    g.addColorStop(0, `rgba(${a.c},${a.a})`); g.addColorStop(1, `rgba(${a.c},0)`);
    bg.fillStyle = g;
    bg.fillRect(x - a.r, y - a.r, a.r * 2, a.r * 2);
  }
  for (const b of BOKEH) {
    const y = ((b.y - t * b.v) % (H + 200) + H + 200) % (H + 200) - 100, x = b.x + Math.sin(t * 0.3 + b.ph) * 30;
    bg.globalAlpha = b.a * (0.6 + 0.4 * Math.sin(t * 0.9 + b.ph));
    bg.drawImage(dot, x - b.s, y - b.s, b.s * 2, b.s * 2);
  }
  bg.globalAlpha = 1;
  bg.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bgc, 0, 0, W, H);
  // the neon: thick and blurred for the glow, then thin and sharp on top
  ga.setTransform(GW / W, 0, 0, GH / H, 0, 0);
  ga.clearRect(0, 0, W, H);
  silk(ga, t, false);
  if (haloAt) halo(ga, t, ...haloAt, false);
  gb.clearRect(0, 0, GW, GH);
  gb.filter = `blur(${Math.max(2, Math.round(3 * SCALE))}px)`;
  gb.drawImage(glowA, 0, 0);
  gb.filter = 'none';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.9;
  ctx.drawImage(glowB, 0, 0, W, H);
  ctx.restore();
  silk(ctx, t, true);
  if (haloAt) halo(ctx, t, ...haloAt, true);
  // a few small sparks rising
  ctx.save();
  ctx.fillStyle = C.mint;
  for (const p of SPARKS) {
    const y = ((p.y - t * p.v) % H + H) % H, x = p.x + Math.sin(t * 0.7 + p.ph) * 12;
    ctx.globalAlpha = 0.5 * (0.5 + 0.5 * Math.sin(t * 2.1 + p.ph));
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- pieces
function logo(x, y, size, alpha = 1) {
  if (alpha <= 0 || size <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(logoImg, x - size / 2, y - size / 2, size, size);
  ctx.restore();
}
// frosted glass: a dark green body, a rim lit from the top left, a sheen on its upper half
function glass(x, y, w, h, r) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  const body = ctx.createLinearGradient(x, y, x + w, y + h);
  body.addColorStop(0, 'rgba(28,96,52,0.62)'); body.addColorStop(1, 'rgba(3,18,9,0.82)');
  ctx.fillStyle = body;
  ctx.fill();
  const rim = ctx.createLinearGradient(x, y, x + w, y + h);
  rim.addColorStop(0, 'rgba(214,255,204,0.9)'); rim.addColorStop(0.45, 'rgba(158,245,138,0.18)'); rim.addColorStop(1, 'rgba(93,255,115,0.6)');
  ctx.strokeStyle = rim;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.clip();
  const sheen = ctx.createLinearGradient(0, y, 0, y + h * 0.55);
  sheen.addColorStop(0, 'rgba(255,255,255,0.09)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(x, y, w, h * 0.55);
  ctx.restore();
}
// a band of light passing diagonally over a rounded shape
function sweep(x, y, w, h, r, u) {
  if (u <= 0 || u >= 1) return;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
  const c = lerp(x - w * 0.6, x + w * 1.6, ease.inOut(u));
  const g = ctx.createLinearGradient(c - 160, y, c + 160, y + h * 0.6);
  g.addColorStop(0, 'rgba(232,251,227,0)'); g.addColorStop(0.5, 'rgba(232,251,227,0.22)'); g.addColorStop(1, 'rgba(232,251,227,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}
// the account row: avatar, the name and a verified-style tick, laid out from the measured name
function account(cx, y, u) {
  if (u <= 0) return;
  const k = ease.out(u);
  const nameW = measure(NAME, 38, 800, 5) - 5, logoD = 72, tick = 19, gap = 20;
  const inner = logoD + gap + nameW + gap + tick * 2, w = inner + 60, h = 100;
  const x0 = cx - inner / 2;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(0, (1 - k) * 30);
  glass(cx - w / 2, y - h / 2, w, h, h / 2);
  logo(x0 + logoD / 2, y, logoD);
  text(NAME, x0 + logoD + gap, y + 13, { size: 38, weight: 800, color: C.mint, dir: 'ltr', align: 'left', ls: 5 });
  const tx = x0 + logoD + gap + nameW + gap + tick;
  ctx.fillStyle = C.light;
  ctx.beginPath(); ctx.arc(tx, y, tick, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(tx - 9, y + 1); ctx.lineTo(tx - 3, y + 7); ctx.lineTo(tx + 10, y - 7); ctx.stroke();
  ctx.restore();
}
// the follow button: a soft green pill; tapped on the bar line, it turns to glass with a tick
function button(cx, y, t0, tap, t) {
  const u = prog(t, t0, t0 + 0.6);
  if (u <= 0) return;
  const done = t >= tap;
  const press = t >= tap - 0.05 ? Math.exp(-Math.max(0, t - tap) * 10) : 0;
  const w = 440, h = 112, s = ease.back(u) * (1 - 0.05 * press);
  ctx.save();
  ctx.globalAlpha = ease.out(u);
  ctx.translate(cx, y);
  ctx.scale(s, s);
  if (done) {
    glass(-w / 2, -h / 2, w, h, h / 2);
    text('فۆڵۆکرا  ✓', 0, 17, { size: 48, weight: 800, color: C.light });
  } else {
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2);
    const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    g.addColorStop(0, C.mint); g.addColorStop(0.45, C.light); g.addColorStop(1, C.neon);
    ctx.fillStyle = g;
    ctx.fill();
    text('فۆڵۆ بکە', 0, 17, { size: 50, weight: 900, color: C.ink });
  }
  ctx.restore();
  sweep(cx - w / 2, y - h / 2, w, h, h / 2, prog(t, t0 + 0.5, t0 + 1.3));
  // the ripple of the tap
  const ru = prog(t, tap, tap + 0.7);
  if (ru > 0 && ru < 1) {
    ctx.save();
    ctx.strokeStyle = C.light;
    ctx.globalAlpha = (1 - ru) * 0.8;
    ctx.lineWidth = 4 * (1 - ru) + 1;
    const e = 34 * ease.out(ru);
    ctx.beginPath(); ctx.roundRect(cx - w / 2 - e, y - h / 2 - e, w + 2 * e, h + 2 * e, h / 2 + e); ctx.stroke();
    ctx.restore();
  }
}
function finger(x, y, t, tap) {
  // a soft touch point that glides in, presses and leaves
  const inU = ease.inOut(prog(t, tap - 0.75, tap - 0.05));
  const outU = ease.in(prog(t, tap + 0.3, tap + 0.85));
  if (inU <= 0 || outU >= 1) return;
  const px = lerp(x + 300, x + 70, inU) + outU * 320, py = lerp(y + 300, y + 22, inU) + outU * 280;
  const press = t >= tap - 0.05 && t < tap + 0.22 ? 0.82 : 1;
  ctx.save();
  ctx.globalAlpha = (1 - outU) * clamp(inU * 3);
  const g = ctx.createRadialGradient(px, py, 0, px, py, 46 * press);
  g.addColorStop(0, 'rgba(232,251,227,0.85)'); g.addColorStop(0.6, 'rgba(232,251,227,0.45)'); g.addColorStop(1, 'rgba(232,251,227,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px, py, 46 * press, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(158,245,138,0.8)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(px, py, 54 * press, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function sparkle(x, y, t, t0) {
  const u = prog(t, t0, t0 + 0.9);
  if (u <= 0 || u >= 1) return;
  const r = rand(Math.round(t0 * 100));
  ctx.save();
  ctx.fillStyle = C.mint;
  for (let k = 0; k < 12; k++) {
    const a = r() * Math.PI * 2, d = (90 + r() * 170) * ease.out(u);
    const s = (3 + r() * 6) * (1 - u);
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d * 0.55 - 40 * u;
    ctx.save(); ctx.translate(px, py); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, -s * 2.2); ctx.lineTo(s * 0.45, 0); ctx.lineTo(0, s * 2.2); ctx.lineTo(-s * 0.45, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
// how a scene's content comes in and leaves: a short drift from the right, out to the left
function stageIn(t, t0, t1) {
  const i = ease.out(prog(t, t0, t0 + 0.7)), o = ease.in(prog(t, t1 - 0.45, t1));
  return { dx: (1 - i) * 70 - o * 70, a: i * (1 - o) };
}

// ---------------------------------------------------------------- scenes
function introScene(t) {
  const lu = prog(t, 0.5, 1.5), out = 1 - ease.in(prog(t, 4.5, 5.0));
  background(t, [540, 780, 300, ease.out(prog(t, 0.7, 1.7)) * out]);
  logo(540, 780, 430 * lerp(0.86, 1, ease.out(lu)), ease.out(lu) * out);
  // the name, one letter after another
  const size = 70, ls = 12, full = measure(NAME, size, 900, ls) - ls;
  let x = 540 - full / 2;
  for (let k = 0; k < NAME.length; k++) {
    const ch = NAME[k], w = measure(ch, size, 900, ls);
    const u = ease.out(prog(t, 1.7 + k * 0.055, 2.2 + k * 0.055));
    if (u > 0) text(ch, x, 1240 + (1 - u) * 26, { size, weight: 900, color: C.mint, dir: 'ltr', align: 'left', alpha: u * out });
    x += w;
  }
  // a thin neon line drawn out under it
  const lw = 560 * ease.inOut(prog(t, 2.5, 3.2));
  if (lw > 0) {
    const g = ctx.createLinearGradient(540 - lw / 2, 0, 540 + lw / 2, 0);
    g.addColorStop(0, 'rgba(93,255,115,0)'); g.addColorStop(0.5, C.neon); g.addColorStop(1, 'rgba(93,255,115,0)');
    ctx.save(); ctx.globalAlpha = out; ctx.fillStyle = g; ctx.fillRect(540 - lw / 2, 1285, lw, 3); ctx.restore();
  }
  fadeUp('بۆردی وەرزشی یەکێتیی نیشتمانیی کوردستان', 540, 1365, prog(t, 2.9, 3.6), { size: 44, weight: 700, color: C.light, alpha: out });
}
function titleScene(t) {
  const { dx, a } = stageIn(t, TITLE_AT, P0);
  background(t, [540, 560, 210, a]);
  ctx.save();
  ctx.translate(dx, 0);
  logo(540, 560, 300 * lerp(0.9, 1, ease.out(prog(t, TITLE_AT, TITLE_AT + 0.7))), a);
  ctx.globalAlpha = a;
  riseText('فۆڵۆمان بکەن', 540, 960, prog(t, TITLE_AT + 0.15, TITLE_AT + 0.85), { size: 130, weight: 900, color: C.mint });
  fadeUp(NAME, 540, 1060, prog(t, TITLE_AT + 0.45, TITLE_AT + 1.05), { size: 46, weight: 800, color: C.light, dir: 'ltr', ls: 12 });
  fadeUp('لە هەموو تۆڕە کۆمەڵایەتییەکان', 540, 1150, prog(t, TITLE_AT + 0.65, TITLE_AT + 1.25), { size: 52, weight: 700, color: C.mint });
  PLATFORMS.forEach((p, i) => {
    const u = prog(t, POPS[i] - 0.05, POPS[i] + 0.45);
    if (u <= 0) return;
    const x = 540 + (1 - i) * 230, y = 1400 + Math.sin(t * 1.6 + i * 1.3) * 7;
    const k = ease.back(u);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(k, k);
    glass(-90, -90, 180, 180, 48);
    icon(p.id, 0, 0, 56);
    ctx.restore();
    sweep(x - 90, y - 90, 180, 180, 48, prog(t, POPS[i] + 0.3, POPS[i] + 1.0));
  });
  ctx.restore();
}
function platformScene(t, i) {
  const p = PLATFORMS[i], t0 = P0 + i * PLEN, tap = TAP[i];
  const { dx, a } = stageIn(t, t0, t0 + PLEN);
  const cx = 540, cy = 640;
  background(t, [cx + dx, cy, 300, a]);
  ctx.save();
  ctx.translate(dx, 0);
  ctx.globalAlpha = a;
  const k = lerp(0.9, 1, ease.out(prog(t, t0, t0 + 0.7)));
  const fy = cy + Math.sin(t * 1.5) * 8;
  ctx.save();
  ctx.translate(cx, fy);
  ctx.scale(k, k);
  glass(-210, -210, 420, 420, 110);
  icon(p.id, 0, 0, 138);
  ctx.restore();
  sweep(cx - 210 * k, fy - 210 * k, 420 * k, 420 * k, 110 * k, prog(t, t0 + 0.7, t0 + 1.6));
  fadeUp(p.en, cx, 985, prog(t, t0 + 0.25, t0 + 0.85), { size: 46, weight: 800, color: C.light, dir: 'ltr', ls: 16 });
  riseText(p.ku, cx, 1105, prog(t, t0 + 0.35, t0 + 1.0), { size: 116, weight: 900, color: C.mint });
  fadeUp(p.line, cx, 1195, prog(t, t0 + 0.55, t0 + 1.15), { size: 48, weight: 700, color: C.light });
  account(cx, 1335, prog(t, t0 + 0.75, t0 + 1.35));
  button(cx, 1500, t0 + 0.95, tap, t);
  sparkle(cx, 1500, t, tap);
  finger(cx, 1500, t, tap);
  ctx.restore();
}
function finaleScene(t) {
  const u = prog(t, END_AT, END_AT + 0.8);
  background(t, [540, 640, 250, ease.out(u)]);
  logo(540, 640, 380 * lerp(0.86, 1, ease.out(u)), ease.out(u));
  // the three platforms around the logo, turning slowly
  PLATFORMS.forEach((p, i) => {
    const su = ease.back(prog(t, END_AT + 0.4 + i * 0.15, END_AT + 0.95 + i * 0.15));
    if (su <= 0) return;
    const ang = -Math.PI / 2 + i * (Math.PI * 2 / 3) + (t - END_AT) * 0.35;
    const x = 540 + Math.cos(ang) * 340, y = 640 + Math.sin(ang) * 340;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(su, su);
    glass(-66, -66, 132, 132, 66);
    icon(p.id, 0, 0, 40);
    ctx.restore();
  });
  riseText('فۆڵۆمان بکەن', 540, 1150, prog(t, END_AT + 0.6, END_AT + 1.3), { size: 118, weight: 900, color: C.mint });
  fadeUp(NAME, 540, 1250, prog(t, END_AT + 0.9, END_AT + 1.5), { size: 50, weight: 800, color: C.light, dir: 'ltr', ls: 12 });
  const pu = prog(t, END_AT + 1.3, END_AT + 2.0);
  if (pu > 0) {
    const label = 'هەمیشە پشتیوانتانین';
    const w = measure(label, 60, 900) + 100, h = 108, k = ease.inOut(clamp(pu * 1.4));
    ctx.save();
    ctx.beginPath(); ctx.roundRect(540 - (w * k) / 2, 1390 - h / 2, w * k, h, h / 2);
    const g = ctx.createLinearGradient(540 - w / 2, 1336, 540 + w / 2, 1444);
    g.addColorStop(0, C.mint); g.addColorStop(0.45, C.light); g.addColorStop(1, C.neon);
    ctx.fillStyle = g; ctx.fill(); ctx.clip();
    text(label, 540, 1411, { size: 60, weight: 900, color: C.ink, alpha: clamp(pu * 3 - 1.2) });
    ctx.restore();
    sweep(540 - w / 2, 1390 - h / 2, w, h, h / 2, prog(t, END_AT + 2.1, END_AT + 2.9));
  }
  fadeUp('بۆردی وەرزشی یەکێتیی نیشتمانیی کوردستان', 540, 1545, prog(t, END_AT + 1.7, END_AT + 2.3), { size: 44, weight: 700, color: C.light });
}

// a soft wash of light at each change of scene
function cutLight(t) {
  for (const c of CUTS) {
    const u = prog(t, c - 0.15, c + 0.6);
    if (u <= 0 || u >= 1) continue;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const x = lerp(-300, W + 300, ease.inOut(u));
    const g = ctx.createLinearGradient(x - 500, 0, x + 500, H * 0.35);
    g.addColorStop(0, 'rgba(93,255,115,0)'); g.addColorStop(0.5, `rgba(158,245,138,${0.12 * Math.sin(Math.PI * u)})`); g.addColorStop(1, 'rgba(93,255,115,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function renderFrame(t) {
  ctx.save();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (t < TITLE_AT) introScene(t);
  else if (t < P0) titleScene(t);
  else if (t < END_AT) platformScene(t, Math.floor((t - P0) / PLEN));
  else finaleScene(t);
  cutLight(t);
  const fade = Math.max(1 - ease.out(prog(t, 0, 0.5)), ease.inOut(prog(t, OUTRO, DURATION)));
  if (fade > 0) { ctx.fillStyle = `rgba(2,5,3,${fade})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

window.ready = Promise.all([...fontFaces.map(f => f.load()), logoImg.decode(), ...ICON_IDS.map(id => iconImgs[id].decode())]).then(() => {
  dot = new OffscreenCanvas(128, 128);
  const g = dot.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(190,255,180,1)'); gr.addColorStop(0.55, 'rgba(158,245,138,0.55)'); gr.addColorStop(0.8, 'rgba(158,245,138,0.25)'); gr.addColorStop(1, 'rgba(158,245,138,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return true;
});
window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.soundCues = () => ({
  duration: DURATION, bpm: 96, bar: BAR,
  logo: 0.6, letters: [1.7, 0.055, NAME.length], title: TITLE_AT,
  pops: POPS, cuts: CUTS, taps: TAP, finale: END_AT, outro: OUTRO,
});

if (!location.search.includes('capture')) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = now => { renderFrame(((now - start) / 1000) % (DURATION + 0.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
