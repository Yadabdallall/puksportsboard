<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<title>PUK Sports Board · Mam Jalal</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { height: 100vh; width: 56.25vh; max-width: 100vw; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
/*
 * A 50 s vertical (9:16) film for the anniversary of the death of President
 * Mam Jalal (Jalal Talabani, 1933 – 2017), from the PUK Sports Board.
 * Black, cream and gold; the archive photos (assets/memorial/) in a wide
 * frame with soft edges, each starting in black and white and slowly
 * blooming into colour, a warm light passing between them, and the words
 * rising in one by one.
 *
 *    0 –  4.75 s  a candle is lit: «بە یادی سەرۆک مام جەلال», 1933 – 2017
 *  4.75 – 42.75 s  eight photos, 4.75 s each, with a line of text under each
 * 42.75 – 50 s   the candle again, «یادت هەمیشە لە دڵماندایە», the board's logo
 *
 * The music (audio/memorial.py) is in 3/4 at about 76 bpm: one photo every two
 * bars. Layout is in 1080x1920 units; ?scale=2 renders 4K. renderFrame(t) is
 * a pure function of time.
 */
const W = 1080, H = 1920, DURATION = 50;
const SCALE = Number(new URLSearchParams(location.search).get('scale') || 1);
const BAR = 2.375;
const P0 = 2 * BAR, PLEN = 2 * BAR;     // the photos: from 4.75 s, two bars each
const OUTRO = P0 + 8 * PLEN;            // 42.75 s
const A0 = OUTRO + 0.4;                 // the candle is lit again
const LOGO_AT = A0 + 2.0, FADE_AT = 48.9;

const C = {
  black: '#050403', cream: '#f4ede1', creamDim: 'rgba(244,237,225,0.74)', gold: '#c9a35b', goldLight: '#e9cf95',
};
// the photo frame: full width, soft top and bottom edges
const FY = 420, FH = 820;
const PHOTOS = [
  { src: '01.jpg', fx: 0.45, fy: 0.35, kicker: 'پێشمەرگە', lines: ['لە چیاکانی کوردستانەوە', 'ڕێگای ئازادیی گرتەبەر'] },
  { src: '02.jpg', fx: 0.5, fy: 0.35, z: [1.02, 1.07], kicker: 'ساڵانی شاخ', lines: ['لە سەنگەردا', 'شان بە شانی هاوڕێکانی'] },
  { src: '03.jpg', fx: 0.45, fy: 0.4, kicker: 'نووسەر و ڕۆشنبیر', lines: ['بە قەڵەمەکەی', 'بۆ گەلەکەی دەنووسی'] },
  { src: '04.jpg', fx: 0.52, fy: 0.4, kicker: '1975', lines: ['دامەزرێنەری', 'یەکێتیی نیشتمانیی کوردستان'] },
  { src: '05.jpg', fx: 0.55, fy: 0.45, kicker: 'سەرکردە', lines: ['دەنگێک کە', 'هەمووانی کۆدەکردەوە'] },
  { src: '06.jpg', fx: 0.36, fy: 0.4, kicker: '2005 – 2014', lines: ['سەرۆک کۆماری عێراق'] },
  { src: '07.jpg', fx: 0.5, fy: 0.4, kicker: 'دەنگی کورد', lines: ['لە سەکۆکانی جیهاندا'] },
  { src: '08.jpg', fx: 0.45, fy: 0.4, kicker: 'مام جەلال', lines: ['زەردەخەنەیەک کە', 'هەرگیز لەبیر ناچێتەوە'] },
];
const startOf = i => P0 + i * PLEN;

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  out: u => 1 - Math.pow(1 - u, 3),
  inOut: u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  sine: u => 0.5 - 0.5 * Math.cos(Math.PI * u),
};
const rand = seed => { let s = seed % 2147483647 || 1; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; };

const stage = document.getElementById('stage');
stage.width = W * SCALE;
stage.height = H * SCALE;
const ctx = stage.getContext('2d');
// the photos are composed here, then their top and bottom edges are faded
const layer = new OffscreenCanvas(Math.round(W * SCALE), Math.round(FH * SCALE));
const lg = layer.getContext('2d');

const font = (weight, size) => `${weight} ${size}px Zain`;
const isLatin = s => /^[0-9\s–.\/-]+$/.test(s);
function text(str, x, y, { size = 40, weight = 700, color = C.cream, align = 'center', dir, ls = 0, alpha = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = font(weight, size);
  ctx.direction = dir || (isLatin(str) ? 'ltr' : 'rtl');
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.globalAlpha *= alpha;
  if (ls) ctx.letterSpacing = `${ls}px`;
  // centred letter-spaced text carries one extra space at its end
  ctx.fillText(str, x + (ls && align === 'center' ? ls / 2 : 0), y);
  ctx.restore();
}
function measure(str, size, weight = 700, ls = 0) {
  ctx.save(); ctx.font = font(weight, size); ctx.letterSpacing = `${ls}px`;
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function fitSize(lines, maxW, size, weight) {
  while (size > 30 && lines.some(l => measure(l, size, weight) > maxW)) size -= 2;
  return size;
}
// a line whose words rise in one after another, from the right (it is read right to left)
function wordsIn(str, cx, y, t0, t, { size, weight = 700, color = C.cream, alpha = 1, step = 0.12, dur = 0.85 }) {
  if (alpha <= 0 || t < t0) return;
  const words = str.split(' ');
  const ws = words.map(w => measure(w, size, weight));
  const sp = measure(' ', size, weight);
  let x = cx + (ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1)) / 2;
  words.forEach((w, i) => {
    const u = ease.out(prog(t, t0 + i * step, t0 + i * step + dur));
    if (u > 0) text(w, x, y + (1 - u) * size * 0.3, { size, weight, color, align: 'right', dir: 'rtl', alpha: alpha * u });
    x -= ws[i] + sp;
  });
}
// a thin gold line drawn out from the middle
function rule(cx, y, w, alpha = 1, color = C.gold) {
  if (w <= 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  g.addColorStop(0, 'rgba(201,163,91,0)'); g.addColorStop(0.2, color); g.addColorStop(0.8, color); g.addColorStop(1, 'rgba(201,163,91,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - w / 2, y - 1.5, w, 3);
  ctx.restore();
}

// ---------------------------------------------------------------- assets
const fontFaces = [['400', 'Zain-Regular.ttf'], ['700', 'Zain-Bold.ttf'], ['800', 'Zain-ExtraBold.ttf'], ['900', 'Zain-Black.ttf']]
  .map(([w, f]) => new FontFace('Zain', `url(assets/fonts/${f})`, { weight: w }));
fontFaces.forEach(f => document.fonts.add(f));
const logoImg = new Image();
logoImg.src = 'assets/logo.png';
const photoImgs = PHOTOS.map(p => { const im = new Image(); im.src = `assets/memorial/${p.src}`; return im; });
let bwImgs = [], bgImgs = [], vignette, dot;

function prepare() {
  // a black-and-white copy of every photo, for the bloom into colour
  bwImgs = photoImgs.map(im => {
    const c = new OffscreenCanvas(im.naturalWidth, im.naturalHeight), g = c.getContext('2d');
    g.filter = 'grayscale(1) contrast(1.08)';
    g.drawImage(im, 0, 0);
    return c;
  });
  // a small, blurred, dark copy to fill the screen behind the frame
  bgImgs = photoImgs.map((im, i) => {
    const w = 135, h = 240, c = new OffscreenCanvas(w, h), g = c.getContext('2d');
    const s = Math.max(w / im.naturalWidth, h / im.naturalHeight) * 1.2;
    const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    g.filter = 'blur(7px) brightness(0.34) saturate(0.55)';
    g.drawImage(im, (w - dw) * PHOTOS[i].fx, (h - dh) / 2, dw, dh);
    return c;
  });
  vignette = new OffscreenCanvas(W / 4, H / 4);
  const vg = vignette.getContext('2d');
  const grad = vg.createRadialGradient(W / 8, H / 8 * 0.9, W / 10, W / 8, H / 8, H / 7);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(0.6, 'rgba(0,0,0,0.25)'); grad.addColorStop(1, 'rgba(0,0,0,0.8)');
  vg.fillStyle = grad; vg.fillRect(0, 0, W / 4, H / 4);
  dot = new OffscreenCanvas(64, 64);
  const dg = dot.getContext('2d');
  const dgr = dg.createRadialGradient(32, 32, 0, 32, 32, 32);
  dgr.addColorStop(0, 'rgba(255,236,190,1)'); dgr.addColorStop(0.3, 'rgba(240,200,130,0.5)'); dgr.addColorStop(1, 'rgba(240,200,130,0)');
  dg.fillStyle = dgr; dg.fillRect(0, 0, 64, 64);
}

function logo(x, y, size, alpha = 1) {
  if (alpha <= 0 || size <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(logoImg, x - size / 2, y - size / 2, size, size);
  ctx.restore();
}

// ---------------------------------------------------------------- the candle
function candle(x, y, t, alpha) {
  if (alpha <= 0) return;
  const flick = 1 + 0.05 * Math.sin(t * 13.1) + 0.035 * Math.sin(t * 23.7 + 1) + 0.02 * Math.sin(t * 41.3);
  const sway = 3.2 * Math.sin(t * 2.9) + 1.6 * Math.sin(t * 7.7 + 2);
  ctx.save();
  ctx.globalAlpha *= alpha;
  // the warm light around it
  const glow = ctx.createRadialGradient(x, y - 70, 0, x, y - 70, 420 * flick);
  glow.addColorStop(0, 'rgba(255,190,110,0.30)'); glow.addColorStop(0.35, 'rgba(255,160,80,0.10)'); glow.addColorStop(1, 'rgba(255,150,70,0)');
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = glow;
  ctx.fillRect(x - 450, y - 520, 900, 900);
  ctx.globalCompositeOperation = 'source-over';
  // the candle: a slim cream column, lit from the flame
  const cw = 46, ch = 150;
  const body = ctx.createLinearGradient(x - cw / 2, 0, x + cw / 2, 0);
  body.addColorStop(0, '#6d6150'); body.addColorStop(0.45, '#efe4d0'); body.addColorStop(1, '#5d5243');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.roundRect(x - cw / 2, y, cw, ch, [6, 6, 2, 2]); ctx.fill();
  const top = ctx.createLinearGradient(0, y, 0, y + 40);
  top.addColorStop(0, 'rgba(255,214,150,0.55)'); top.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = top; ctx.fillRect(x - cw / 2, y, cw, 40);
  ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + 1, y - 12); ctx.stroke();
  // the flame
  const fh = 92 * flick, fw = 19;
  const fy = y - 14;
  const fl = ctx.createRadialGradient(x, fy - 22, 2, x, fy - 30, fh * 0.75);
  fl.addColorStop(0, 'rgba(255,253,240,1)'); fl.addColorStop(0.3, 'rgba(255,226,150,0.95)');
  fl.addColorStop(0.7, 'rgba(255,150,50,0.75)'); fl.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.fillStyle = fl;
  ctx.beginPath();
  ctx.moveTo(x + sway, fy - fh);
  ctx.bezierCurveTo(x + fw * 0.9 + sway * 0.4, fy - fh * 0.55, x + fw * 1.1, fy - fh * 0.12, x, fy);
  ctx.bezierCurveTo(x - fw * 1.1, fy - fh * 0.12, x - fw * 0.9 + sway * 0.4, fy - fh * 0.55, x + sway, fy - fh);
  ctx.fill();
  ctx.fillStyle = 'rgba(110,150,255,0.35)';
  ctx.beginPath(); ctx.ellipse(x, fy - 8, 7, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- the photos
function photoRect(i, t) {
  const im = photoImgs[i], iw = im.naturalWidth, ih = im.naturalHeight, p = PHOTOS[i];
  const s0 = startOf(i);
  const u = prog(t, s0 - 0.6, s0 + PLEN + 0.6);
  const [z0, z1] = p.z || [1.03, 1.13];
  const s = Math.max(W / iw, FH / ih) * lerp(z0, z1, ease.sine(u) * 0.3 + u * 0.7);
  const vw = W / s, vh = FH / s;
  const dir = i % 2 ? 1 : -1;
  const cx = clamp(p.fx * iw + dir * (u - 0.5) * 0.05 * iw, vw / 2, iw - vw / 2);
  const cy = clamp(p.fy * ih + (0.5 - u) * 0.02 * ih, vh / 2, ih - vh / 2);
  return [cx - vw / 2, cy - vh / 2, vw, vh];
}
// how far the photo has bloomed from black and white into (slightly muted) colour
const colourOf = (i, t) => 0.9 * ease.inOut(prog(t, startOf(i) + 0.2, startOf(i) + 2.2));
// photo i is fully in from startOf(i) + 0.5; the first comes out of the intro, the last fades away into the end
const alphaOf = (i, t) => prog(t, startOf(i) - 0.5, startOf(i) + 0.5) * (i === 7 ? 1 - prog(t, OUTRO - 0.2, OUTRO + 0.9) : 1);
function visible(t) {
  const k = clamp(Math.floor((t - P0 + 0.5) / PLEN), 0, 7);
  return k > 0 && t < startOf(k) + 0.5 ? [k - 1, k] : [k];
}

function background(t) {
  for (const i of visible(t)) {
    const a = alphaOf(i, t);
    if (a <= 0) continue;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bgImgs[i], -20, -20, W + 40, H + 40);
    ctx.restore();
  }
}
// the warm light that passes over the frame as one photo gives way to the next
function lightPass(g, t) {
  for (let i = 0; i < 8; i++) {
    const s0 = startOf(i), u = prog(t, s0 - 0.8, s0 + 1.1);
    if (u <= 0 || u >= 1) continue;
    const a = Math.sin(Math.PI * u) * 0.34;
    const x = lerp(-600, W + 600, ease.inOut(u));
    const gr = g.createLinearGradient(x - 420, -200, x + 420, FH * 0.35);
    gr.addColorStop(0, 'rgba(255,190,120,0)'); gr.addColorStop(0.5, `rgba(255,216,160,${a})`); gr.addColorStop(1, 'rgba(255,190,120,0)');
    g.globalCompositeOperation = 'screen';
    g.fillStyle = gr;
    g.fillRect(0, 0, W, FH);
    g.globalCompositeOperation = 'source-over';
  }
}
function photos(t) {
  const shown = visible(t).filter(i => alphaOf(i, t) > 0);
  if (!shown.length) return;
  lg.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  lg.globalCompositeOperation = 'source-over';
  lg.globalAlpha = 1;
  lg.clearRect(0, 0, W, FH);
  lg.imageSmoothingQuality = 'high';
  for (const i of shown) {
    const [sx, sy, sw, sh] = photoRect(i, t), a = alphaOf(i, t), col = colourOf(i, t);
    lg.globalAlpha = a;
    lg.drawImage(bwImgs[i], sx, sy, sw, sh, 0, 0, W, FH);
    if (col > 0) {
      lg.globalAlpha = a * col;
      lg.drawImage(photoImgs[i], sx, sy, sw, sh, 0, 0, W, FH);
    }
  }
  lg.globalAlpha = 1;
  lightPass(lg, t);
  // soft top and bottom edges
  const m = lg.createLinearGradient(0, 0, 0, FH);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(0.14, 'rgba(0,0,0,1)');
  m.addColorStop(0.86, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  lg.globalCompositeOperation = 'destination-in';
  lg.fillStyle = m;
  lg.fillRect(0, 0, W, FH);
  lg.globalCompositeOperation = 'source-over';
  ctx.drawImage(layer, 0, FY, W, FH);
}

// ---------------------------------------------------------------- dust
const DUST = (() => { const r = rand(2017); return Array.from({ length: 46 }, () => ({ x: r() * W, y: r() * H, s: 4 + r() * 10, v: 8 + r() * 22, ph: r() * 6.28, drift: 10 + r() * 30 })); })();
function dust(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const d of DUST) {
    const y = ((d.y - t * d.v) % (H + 40) + H + 40) % (H + 40) - 20;
    const x = d.x + Math.sin(t * 0.4 + d.ph) * d.drift;
    ctx.globalAlpha = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(t * 1.3 + d.ph * 3));
    ctx.drawImage(dot, x - d.s, y - d.s, d.s * 2, d.s * 2);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- scenes
function intro(t) {
  const out = 1 - prog(t, P0 - 0.9, P0 - 0.15);
  if (out <= 0) return;
  candle(540, 730, t, ease.out(prog(t, 0.3, 1.3)) * out);
  text('بە یادی', 540, 1000, { size: 48, weight: 700, color: C.gold, alpha: ease.out(prog(t, 0.9, 1.7)) * out });
  wordsIn('سەرۆک مام جەلال', 540, 1130, 1.3, t, { size: 120, weight: 800, color: C.cream, alpha: out, step: 0.2, dur: 1.0 });
  rule(540, 1185, 420 * ease.inOut(prog(t, 2.0, 2.9)), out);
  text('1933 – 2017', 540, 1270, { size: 54, weight: 700, color: C.goldLight, ls: 10, alpha: ease.out(prog(t, 2.4, 3.1)) * out });
  text('نۆیەمین ساڵیادی کۆچی دوایی', 540, 1350, { size: 46, weight: 700, color: C.creamDim, alpha: ease.out(prog(t, 2.8, 3.5)) * out });
}
function header(t) {
  const a = ease.out(prog(t, P0 + 0.2, P0 + 1.2)) * (1 - prog(t, OUTRO - 0.5, OUTRO + 0.3));
  if (a <= 0) return;
  logo(540, 190, 150, a);
  text('بۆ یادی سەرۆک مام جەلال', 540, 325, { size: 38, weight: 700, color: C.gold, alpha: a });
  text('1933 – 2017', 540, 372, { size: 28, weight: 700, color: C.creamDim, ls: 6, alpha: a });
}
function caption(t) {
  for (let i = 0; i < 8; i++) {
    const s0 = startOf(i), p = PHOTOS[i];
    if (t < s0 + 0.4 || t > s0 + PLEN) continue;
    const end = i === 7 ? OUTRO - 0.2 : s0 + PLEN - 0.3;
    const out = 1 - ease.inOut(prog(t, end - 0.45, end));
    const lift = (1 - out) * -14;
    ctx.save();
    ctx.translate(0, lift);
    // the kicker, between two short gold lines
    const ku = ease.out(prog(t, s0 + 0.5, s0 + 1.2));
    const latin = isLatin(p.kicker);
    const ks = latin ? 46 : 42, kls = latin ? 8 : 0;
    const kw = measure(p.kicker, ks, 700, kls) - kls;
    text(p.kicker, 540, 1330, { size: ks, weight: 700, color: C.goldLight, ls: kls, alpha: ku * out });
    const lw = 70 * ease.inOut(prog(t, s0 + 0.7, s0 + 1.4));
    if (lw > 0) {
      ctx.globalAlpha = out;
      ctx.fillStyle = C.gold;
      ctx.fillRect(540 + kw / 2 + 26, 1316, lw, 2);
      ctx.fillRect(540 - kw / 2 - 26 - lw, 1316, lw, 2);
      ctx.globalAlpha = 1;
    }
    const size = fitSize(p.lines, 980, 74, 800);
    p.lines.forEach((line, k) => {
      wordsIn(line, 540, 1450 + k * 100, s0 + 0.85 + k * 0.45, t, { size, weight: 800, color: C.cream, alpha: out });
    });
    ctx.restore();
  }
}
function outro(t) {
  if (t < A0) return;
  const fin = 1 - prog(t, FADE_AT, FADE_AT + 1.0);
  candle(540, 470, t, ease.out(prog(t, A0, A0 + 1.0)) * fin);
  wordsIn('یادت هەمیشە لە دڵماندایە', 540, 780, A0 + 0.6, t, { size: 80, weight: 800, color: C.cream, alpha: fin, step: 0.18, dur: 1.0 });
  text('سەرۆک مام جەلال', 540, 870, { size: 48, weight: 700, color: C.gold, alpha: ease.out(prog(t, A0 + 1.4, A0 + 2.1)) * fin });
  // the board's logo inside a gold ring that draws itself
  const lu = ease.out(prog(t, LOGO_AT, LOGO_AT + 1.0));
  logo(540, 1170, 300 * lerp(0.94, 1, lu), lu * fin);
  const ru = ease.inOut(prog(t, LOGO_AT + 0.2, LOGO_AT + 1.6));
  if (ru > 0) {
    ctx.save();
    ctx.globalAlpha = fin;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(540, 1170, 182, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ru); ctx.stroke();
    ctx.restore();
  }
  text('بۆردی وەرزشی', 540, 1420, { size: 50, weight: 800, color: C.cream, alpha: ease.out(prog(t, LOGO_AT + 1.0, LOGO_AT + 1.7)) * fin });
  text('یەکێتیی نیشتمانیی کوردستان', 540, 1485, { size: 40, weight: 700, color: C.creamDim, alpha: ease.out(prog(t, LOGO_AT + 1.3, LOGO_AT + 2.0)) * fin });
}

function renderFrame(t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, W, H);
  background(t);
  photos(t);
  dust(t);
  ctx.drawImage(vignette, 0, 0, W, H);
  intro(t);
  header(t);
  caption(t);
  outro(t);
  // in from black, out to black
  const fade = Math.max(1 - prog(t, 0, 0.4), prog(t, DURATION - 0.6, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = Promise.all([...fontFaces.map(f => f.load()), logoImg.decode(), ...photoImgs.map(im => im.decode())])
  .then(() => { prepare(); return true; });
window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.soundCues = () => ({
  duration: DURATION, bar: BAR, beats: 3,
  flame: 0.3, title: 1.3, photos: PHOTOS.map((_, i) => startOf(i)), outro: OUTRO, flame2: A0, logo: LOGO_AT, fade: FADE_AT,
});

if (!location.search.includes('capture')) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = now => { renderFrame(((now - start) / 1000) % (DURATION + 0.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
