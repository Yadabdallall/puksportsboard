<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<title>PUK Sports Board · Mam Jalal</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { height: 100vh; width: 56.25vh; max-width: 100vw; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
/*
 * A 50 s vertical (9:16) film for the anniversary of the death of President
 * Mam Jalal (Jalal Talabani, 1933 – 2017), from the PUK Sports Board.
 * Black, cream and gold; the archive photos (assets/memorial/) in a wide
 * frame with soft edges, each starting in black and white and slowly
 * blooming into colour, a warm light passing between them, and the words
 * rising in one by one.
 *
 *     0 –  4.75 s  «سەرۆک مام جەلال», 1933 – 2017, the ninth anniversary of his death
 *  4.75 – 64.4 s   eight photos (4.75 s each) and two clips of Mam Jalal speaking,
 *                  in their own sound: the 1992 speech after «سەرکردە», and his
 *                  talk to the camera before the last photo
 *  64.4 – 71.6 s   «یادت هەمیشە لە دڵماندایە», the board's logo, the office of the
 *                  secretariat of President Mam Jalal and the board's name
 *
 * The music (audio/memorial.py) is in 3/4 at about 76 bpm: one photo every two
 * bars; it holds still under the clips. Layout is in 1080x1920 units;
 * ?scale=2 renders 4K. renderFrame(t) is a pure function of time; the clips'
 * frames are loaded by prepareFrame(t) first (assets/memorial/make_clips.py).
 */
const W = 1080, H = 1920;
const SCALE = Number(new URLSearchParams(location.search).get('scale') || 1);
const BAR = 2.375;
const P0 = 2 * BAR, PLEN = 2 * BAR;     // the photos: from 4.75 s, two bars each

const C = {
  black: '#050403', cream: '#f4ede1', creamDim: 'rgba(244,237,225,0.74)', gold: '#c9a35b', goldLight: '#e9cf95',
};
// the photo frame: full width, soft top and bottom edges
const FY = 420, FH = 820;
const PHOTOS = [
  { src: '01.jpg', fx: 0.45, fy: 0.35, kicker: 'پێشمەرگە', lines: ['لە چیاکانی کوردستانەوە', 'ڕێگای ئازادیی گرتەبەر'] },
  { src: '02.jpg', fx: 0.5, fy: 0.35, z: [1.02, 1.07], kicker: 'ساڵانی شاخ', lines: ['لە سەنگەردا', 'شان بە شانی هاوڕێکانی'] },
  { src: '03.jpg', fx: 0.45, fy: 0.4, kicker: 'نووسەر و ڕۆشنبیر', lines: ['بە قەڵەمەکەی', 'بۆ گەلەکەی دەنووسی'] },
  { src: '04.jpg', fx: 0.52, fy: 0.4, kicker: '1975', lines: ['دامەزرێنەری', 'یەکێتیی نیشتمانیی کوردستان'] },
  { src: '05.jpg', fx: 0.55, fy: 0.45, kicker: 'سەرکردە', lines: ['دەنگێک کە', 'هەمووانی کۆدەکردەوە'] },
  { src: '06.jpg', fx: 0.36, fy: 0.4, kicker: '2005 – 2014', lines: ['سەرۆک کۆماری عێراق'] },
  { src: '07.jpg', fx: 0.5, fy: 0.4, kicker: 'دەنگی کورد', lines: ['لە سەکۆکانی جیهاندا'] },
  { src: '08.jpg', fx: 0.45, fy: 0.4, kicker: 'مام جەلال', lines: ['زەردەخەنەیەک کە', 'هەرگیز لەبیر ناچێتەوە'] },
];
// the clips, unpacked into 30 fps frames of 2160x1640 by assets/memorial/make_clips.py
const CLIP_FPS = 30;
const CLIPS = {
  A: { frames: 330, kicker: '1992', lines: ['لە نێو خەڵکەکەیدا'] },
  B: { frames: 379, kicker: 'سەرۆک مام جەلال', lines: ['وتەکانی هەمیشە', 'لە یادماندا دەمێننەوە'] },
};
// what the frame shows, in order: photos by number, clips by letter. A clip
// starts playing (picture and sound) as it begins to fade in, half a second
// before its start, and plays to the end of the next cross-fade.
const ORDER = [0, 1, 2, 3, 4, 'A', 5, 6, 'B', 7];
const SEG = [];
for (let o = 0, s = P0; o < ORDER.length; o++) {
  const id = ORDER[o], clip = typeof id === 'string';
  const len = clip ? CLIPS[id].frames / CLIP_FPS - 1 : PLEN;
  SEG.push({ ...(clip ? CLIPS[id] : PHOTOS[id]), clip: clip ? id : null, photo: clip ? null : id, start: s, len });
  s += len;
}
const LAST = SEG.length - 1;
const OUTRO = SEG[LAST].start + SEG[LAST].len;   // 64.38 s
const A0 = OUTRO + 0.4;                         // the closing words begin
const LOGO_AT = A0 + 2.0, FADE_AT = OUTRO + 6.15, DURATION = OUTRO + 7.25;

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  out: u => 1 - Math.pow(1 - u, 3),
  inOut: u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  sine: u => 0.5 - 0.5 * Math.cos(Math.PI * u),
};
const rand = seed => { let s = seed % 2147483647 || 1; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; };

const stage = document.getElementById('stage');
stage.width = W * SCALE;
stage.height = H * SCALE;
const ctx = stage.getContext('2d');
// the photos are composed here, then their top and bottom edges are faded
const layer = new OffscreenCanvas(Math.round(W * SCALE), Math.round(FH * SCALE));
const lg = layer.getContext('2d');

const font = (weight, size) => `${weight} ${size}px Zain`;
const isLatin = s => /^[0-9\s–.\/-]+$/.test(s);
function text(str, x, y, { size = 40, weight = 700, color = C.cream, align = 'center', dir, ls = 0, alpha = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = font(weight, size);
  ctx.direction = dir || (isLatin(str) ? 'ltr' : 'rtl');
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.globalAlpha *= alpha;
  if (ls) ctx.letterSpacing = `${ls}px`;
  // centred letter-spaced text carries one extra space at its end
  ctx.fillText(str, x + (ls && align === 'center' ? ls / 2 : 0), y);
  ctx.restore();
}
function measure(str, size, weight = 700, ls = 0) {
  ctx.save(); ctx.font = font(weight, size); ctx.letterSpacing = `${ls}px`;
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function fitSize(lines, maxW, size, weight) {
  while (size > 30 && lines.some(l => measure(l, size, weight) > maxW)) size -= 2;
  return size;
}
// a line whose words rise in one after another, from the right (it is read right to left)
function wordsIn(str, cx, y, t0, t, { size, weight = 700, color = C.cream, alpha = 1, step = 0.12, dur = 0.85 }) {
  if (alpha <= 0 || t < t0) return;
  const words = str.split(' ');
  const ws = words.map(w => measure(w, size, weight));
  const sp = measure(' ', size, weight);
  let x = cx + (ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1)) / 2;
  words.forEach((w, i) => {
    const u = ease.out(prog(t, t0 + i * step, t0 + i * step + dur));
    if (u > 0) text(w, x, y + (1 - u) * size * 0.3, { size, weight, color, align: 'right', dir: 'rtl', alpha: alpha * u });
    x -= ws[i] + sp;
  });
}
// a thin gold line drawn out from the middle
function rule(cx, y, w, alpha = 1, color = C.gold) {
  if (w <= 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  g.addColorStop(0, 'rgba(201,163,91,0)'); g.addColorStop(0.2, color); g.addColorStop(0.8, color); g.addColorStop(1, 'rgba(201,163,91,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - w / 2, y - 1.5, w, 3);
  ctx.restore();
}

// ---------------------------------------------------------------- assets
const fontFaces = [['400', 'Zain-Regular.ttf'], ['700', 'Zain-Bold.ttf'], ['800', 'Zain-ExtraBold.ttf'], ['900', 'Zain-Black.ttf']]
  .map(([w, f]) => new FontFace('Zain', `url(assets/fonts/${f})`, { weight: w }));
fontFaces.forEach(f => document.fonts.add(f));
const logoImg = new Image();
logoImg.src = 'assets/logo.png';
const photoImgs = PHOTOS.map(p => { const im = new Image(); im.src = `assets/memorial/${p.src}`; return im; });
let bwImgs = [], bgImgs = [], vignette, dot;
const clipSrc = (id, f) => `assets/memorial/clips/${id}/${String(f).padStart(4, '0')}.jpg`;
const clipMid = Object.fromEntries(Object.keys(CLIPS).map(id => { const im = new Image(); im.src = clipSrc(id, 150); return [id, im]; }));
// decoded clip frames, by "A/0123"; only the last few are kept
const clipCache = new Map();
const clipFrame = (k, t) => clamp(Math.floor((t - (SEG[k].start - 0.5)) * CLIP_FPS), 0, SEG[k].frames - 1);
function loadClipFrame(id, f) {
  const key = `${id}/${f}`;
  if (!clipCache.has(key)) {
    const im = new Image();
    im.src = clipSrc(id, f);
    clipCache.set(key, { im, ready: false, p: im.decode().then(() => { clipCache.get(key) && (clipCache.get(key).ready = true); }) });
    while (clipCache.size > 12) clipCache.delete(clipCache.keys().next().value);
  }
  return clipCache.get(key);
}
// the frames of the clips on screen at t, loaded before renderFrame(t) draws them
async function prepareFrame(t) {
  await Promise.all(visible(t).filter(k => SEG[k].clip).map(k => loadClipFrame(SEG[k].clip, clipFrame(k, t)).p));
}

function prepare() {
  // a black-and-white copy of every photo, for the bloom into colour
  bwImgs = photoImgs.map(im => {
    const c = new OffscreenCanvas(im.naturalWidth, im.naturalHeight), g = c.getContext('2d');
    g.filter = 'grayscale(1) contrast(1.08)';
    g.drawImage(im, 0, 0);
    return c;
  });
  // a small, blurred, dark copy to fill the screen behind the frame (for a clip, of its middle frame)
  bgImgs = SEG.map(sg => {
    const im = sg.clip ? clipMid[sg.clip] : photoImgs[sg.photo];
    const w = 135, h = 240, c = new OffscreenCanvas(w, h), g = c.getContext('2d');
    const s = Math.max(w / im.naturalWidth, h / im.naturalHeight) * 1.2;
    const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    g.filter = 'blur(7px) brightness(0.34) saturate(0.55)';
    g.drawImage(im, (w - dw) * (sg.fx || 0.5), (h - dh) / 2, dw, dh);
    return c;
  });
  vignette = new OffscreenCanvas(W / 4, H / 4);
  const vg = vignette.getContext('2d');
  const grad = vg.createRadialGradient(W / 8, H / 8 * 0.9, W / 10, W / 8, H / 8, H / 7);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(0.6, 'rgba(0,0,0,0.25)'); grad.addColorStop(1, 'rgba(0,0,0,0.8)');
  vg.fillStyle = grad; vg.fillRect(0, 0, W / 4, H / 4);
  dot = new OffscreenCanvas(64, 64);
  const dg = dot.getContext('2d');
  const dgr = dg.createRadialGradient(32, 32, 0, 32, 32, 32);
  dgr.addColorStop(0, 'rgba(255,236,190,1)'); dgr.addColorStop(0.3, 'rgba(240,200,130,0.5)'); dgr.addColorStop(1, 'rgba(240,200,130,0)');
  dg.fillStyle = dgr; dg.fillRect(0, 0, 64, 64);
}

function logo(x, y, size, alpha = 1) {
  if (alpha <= 0 || size <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(logoImg, x - size / 2, y - size / 2, size, size);
  ctx.restore();
}

// ---------------------------------------------------------------- the photos and clips
function photoRect(k, t) {
  const sg = SEG[k], i = sg.photo, im = photoImgs[i], iw = im.naturalWidth, ih = im.naturalHeight;
  const u = prog(t, sg.start - 0.6, sg.start + sg.len + 0.6);
  const [z0, z1] = sg.z || [1.03, 1.13];
  const s = Math.max(W / iw, FH / ih) * lerp(z0, z1, ease.sine(u) * 0.3 + u * 0.7);
  const vw = W / s, vh = FH / s;
  const dir = i % 2 ? 1 : -1;
  const cx = clamp(sg.fx * iw + dir * (u - 0.5) * 0.05 * iw, vw / 2, iw - vw / 2);
  const cy = clamp(sg.fy * ih + (0.5 - u) * 0.02 * ih, vh / 2, ih - vh / 2);
  return [cx - vw / 2, cy - vh / 2, vw, vh];
}
// how far a photo has bloomed from black and white into (slightly muted) colour
const colourOf = (k, t) => 0.9 * ease.inOut(prog(t, SEG[k].start + 0.2, SEG[k].start + 2.2));
// segment k is fully in from its start + 0.5; the first comes out of the intro, the last fades away into the end
const alphaOf = (k, t) => prog(t, SEG[k].start - 0.5, SEG[k].start + 0.5) * (k === LAST ? 1 - prog(t, OUTRO - 0.2, OUTRO + 0.9) : 1);
function visible(t) {
  let k = 0;
  for (let i = 1; i < SEG.length; i++) if (t >= SEG[i].start - 0.5) k = i;
  return k > 0 && t < SEG[k].start + 0.5 ? [k - 1, k] : [k];
}

function background(t) {
  for (const k of visible(t)) {
    const a = alphaOf(k, t);
    if (a <= 0) continue;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bgImgs[k], -20, -20, W + 40, H + 40);
    ctx.restore();
  }
}
// the warm light that passes over the frame as one photo gives way to the next
function lightPass(g, t) {
  for (const sg of SEG) {
    const u = prog(t, sg.start - 0.8, sg.start + 1.1);
    if (u <= 0 || u >= 1) continue;
    const a = Math.sin(Math.PI * u) * 0.34;
    const x = lerp(-600, W + 600, ease.inOut(u));
    const gr = g.createLinearGradient(x - 420, -200, x + 420, FH * 0.35);
    gr.addColorStop(0, 'rgba(255,190,120,0)'); gr.addColorStop(0.5, `rgba(255,216,160,${a})`); gr.addColorStop(1, 'rgba(255,190,120,0)');
    g.globalCompositeOperation = 'screen';
    g.fillStyle = gr;
    g.fillRect(0, 0, W, FH);
    g.globalCompositeOperation = 'source-over';
  }
}
function photos(t) {
  const shown = visible(t).filter(k => alphaOf(k, t) > 0);
  if (!shown.length) return;
  lg.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  lg.globalCompositeOperation = 'source-over';
  lg.globalAlpha = 1;
  lg.clearRect(0, 0, W, FH);
  lg.imageSmoothingQuality = 'high';
  for (const k of shown) {
    const sg = SEG[k], a = alphaOf(k, t);
    if (sg.clip) {
      // the clip's own frame, with a very slow push in
      const fr = loadClipFrame(sg.clip, clipFrame(k, t));
      if (!fr.ready) continue;
      const iw = fr.im.naturalWidth, ih = fr.im.naturalHeight;
      const z = lerp(1.0, 1.05, prog(t, sg.start - 0.5, sg.start + sg.len + 0.5));
      lg.globalAlpha = a;
      lg.drawImage(fr.im, iw * (1 - 1 / z) / 2, ih * (1 - 1 / z) / 2, iw / z, ih / z, 0, 0, W, FH);
      continue;
    }
    const [sx, sy, sw, sh] = photoRect(k, t), col = colourOf(k, t);
    lg.globalAlpha = a;
    lg.drawImage(bwImgs[sg.photo], sx, sy, sw, sh, 0, 0, W, FH);
    if (col > 0) {
      lg.globalAlpha = a * col;
      lg.drawImage(photoImgs[sg.photo], sx, sy, sw, sh, 0, 0, W, FH);
    }
  }
  lg.globalAlpha = 1;
  lightPass(lg, t);
  // soft top and bottom edges
  const m = lg.createLinearGradient(0, 0, 0, FH);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(0.14, 'rgba(0,0,0,1)');
  m.addColorStop(0.86, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  lg.globalCompositeOperation = 'destination-in';
  lg.fillStyle = m;
  lg.fillRect(0, 0, W, FH);
  lg.globalCompositeOperation = 'source-over';
  ctx.drawImage(layer, 0, FY, W, FH);
}

// ---------------------------------------------------------------- dust
const DUST = (() => { const r = rand(2017); return Array.from({ length: 46 }, () => ({ x: r() * W, y: r() * H, s: 4 + r() * 10, v: 8 + r() * 22, ph: r() * 6.28, drift: 10 + r() * 30 })); })();
function dust(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const d of DUST) {
    const y = ((d.y - t * d.v) % (H + 40) + H + 40) % (H + 40) - 20;
    const x = d.x + Math.sin(t * 0.4 + d.ph) * d.drift;
    ctx.globalAlpha = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(t * 1.3 + d.ph * 3));
    ctx.drawImage(dot, x - d.s, y - d.s, d.s * 2, d.s * 2);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- scenes
function intro(t) {
  const out = 1 - prog(t, P0 - 0.9, P0 - 0.15);
  if (out <= 0) return;
  wordsIn('سەرۆک مام جەلال', 540, 920, 1.0, t, { size: 120, weight: 800, color: C.cream, alpha: out, step: 0.2, dur: 1.0 });
  rule(540, 975, 420 * ease.inOut(prog(t, 1.8, 2.7)), out);
  text('1933 – 2017', 540, 1060, { size: 54, weight: 700, color: C.goldLight, ls: 10, alpha: ease.out(prog(t, 2.2, 2.9)) * out });
  text('نۆیەمین ساڵیادی کۆچی دوایی', 540, 1140, { size: 46, weight: 700, color: C.creamDim, alpha: ease.out(prog(t, 2.6, 3.3)) * out });
}
function header(t) {
  const a = ease.out(prog(t, P0 + 0.2, P0 + 1.2)) * (1 - prog(t, OUTRO - 0.5, OUTRO + 0.3));
  if (a <= 0) return;
  logo(540, 190, 150, a);
  text('بۆ یادی سەرۆک مام جەلال', 540, 325, { size: 38, weight: 700, color: C.gold, alpha: a });
  text('1933 – 2017', 540, 372, { size: 28, weight: 700, color: C.creamDim, ls: 6, alpha: a });
}
function caption(t) {
  for (let k = 0; k < SEG.length; k++) {
    const p = SEG[k], s0 = p.start;
    if (t < s0 + 0.4 || t > s0 + p.len) continue;
    const end = k === LAST ? OUTRO - 0.2 : s0 + p.len - 0.3;
    const out = 1 - ease.inOut(prog(t, end - 0.45, end));
    const lift = (1 - out) * -14;
    ctx.save();
    ctx.translate(0, lift);
    // the kicker, between two short gold lines
    const ku = ease.out(prog(t, s0 + 0.5, s0 + 1.2));
    const latin = isLatin(p.kicker);
    const ks = latin ? 46 : 42, kls = latin ? 8 : 0;
    const kw = measure(p.kicker, ks, 700, kls) - kls;
    text(p.kicker, 540, 1330, { size: ks, weight: 700, color: C.goldLight, ls: kls, alpha: ku * out });
    const lw = 70 * ease.inOut(prog(t, s0 + 0.7, s0 + 1.4));
    if (lw > 0) {
      ctx.globalAlpha = out;
      ctx.fillStyle = C.gold;
      ctx.fillRect(540 + kw / 2 + 26, 1316, lw, 2);
      ctx.fillRect(540 - kw / 2 - 26 - lw, 1316, lw, 2);
      ctx.globalAlpha = 1;
    }
    const size = fitSize(p.lines, 980, 74, 800);
    p.lines.forEach((line, k) => {
      wordsIn(line, 540, 1450 + k * 100, s0 + 0.85 + k * 0.45, t, { size, weight: 800, color: C.cream, alpha: out });
    });
    ctx.restore();
  }
}
function outro(t) {
  if (t < A0) return;
  const fin = 1 - prog(t, FADE_AT, FADE_AT + 1.0);
  wordsIn('یادت هەمیشە لە دڵماندایە', 540, 620, A0 + 0.6, t, { size: 80, weight: 800, color: C.cream, alpha: fin, step: 0.18, dur: 1.0 });
  text('سەرۆک مام جەلال', 540, 710, { size: 48, weight: 700, color: C.gold, alpha: ease.out(prog(t, A0 + 1.4, A0 + 2.1)) * fin });
  // the board's logo inside a gold ring that draws itself
  const lu = ease.out(prog(t, LOGO_AT, LOGO_AT + 1.0));
  logo(540, 990, 300 * lerp(0.94, 1, lu), lu * fin);
  const ru = ease.inOut(prog(t, LOGO_AT + 0.2, LOGO_AT + 1.6));
  if (ru > 0) {
    ctx.save();
    ctx.globalAlpha = fin;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(540, 990, 182, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ru); ctx.stroke();
    ctx.restore();
  }
  text('مەکتەبی سکرتارییەتی سەرۆک مام جەلال', 540, 1290, { size: 46, weight: 800, color: C.goldLight, alpha: ease.out(prog(t, LOGO_AT + 0.9, LOGO_AT + 1.6)) * fin });
  text('بۆردی وەرزشی', 540, 1380, { size: 50, weight: 800, color: C.cream, alpha: ease.out(prog(t, LOGO_AT + 1.2, LOGO_AT + 1.9)) * fin });
  text('یەکێتیی نیشتمانیی کوردستان', 540, 1445, { size: 40, weight: 700, color: C.creamDim, alpha: ease.out(prog(t, LOGO_AT + 1.5, LOGO_AT + 2.2)) * fin });
}

function renderFrame(t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, W, H);
  background(t);
  photos(t);
  dust(t);
  ctx.drawImage(vignette, 0, 0, W, H);
  intro(t);
  header(t);
  caption(t);
  outro(t);
  // in from black, out to black
  const fade = Math.max(1 - prog(t, 0, 0.4), prog(t, DURATION - 0.6, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = Promise.all([...fontFaces.map(f => f.load()), logoImg.decode(), ...photoImgs.map(im => im.decode()),
  ...Object.values(clipMid).map(im => im.decode())]).then(() => { prepare(); return true; });
window.prepareFrame = prepareFrame;
window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.soundCues = () => ({
  duration: DURATION, bar: BAR, beats: 3, title: 1.0,
  segments: SEG.map(sg => (sg.clip ? { clip: sg.clip, start: sg.start, len: sg.len, audio: [sg.start - 0.5, sg.frames / CLIP_FPS] }
    : { photo: sg.photo, start: sg.start, len: sg.len })),
  outro: OUTRO, logo: LOGO_AT, fade: FADE_AT,
});

if (!location.search.includes('capture')) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = now => { const t = ((now - start) / 1000) % (DURATION + 0.5); prepareFrame(t); renderFrame(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
