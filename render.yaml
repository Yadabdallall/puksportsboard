services:
  - type: web
    name: puk-sports-board
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_CODE
        sync: false
    disk:
      name: puk-data
      mountPath: /var/data
      sizeGB: 5
