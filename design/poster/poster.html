<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<title>PUK Sports Board Poster</title>
<link href="fonts.css" rel="stylesheet">
<style>
:root{
  --neon:#39ff88;
  --neon-2:#16d864;
  --neon-deep:#0a9a45;
  --lime:#b8ff5a;
  --ink:#f3fff7;
  --bg0:#010805;
  --bg1:#03170c;
  --gold:#d9c27a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--bg0);overflow:hidden}
body{font-family:"Noto Kufi Arabic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

.poster{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:
    radial-gradient(900px 620px at 50% 18%, rgba(22,190,90,.34), transparent 62%),
    radial-gradient(700px 500px at 88% 78%, rgba(40,255,140,.16), transparent 60%),
    radial-gradient(800px 600px at 0% 100%, rgba(120,255,60,.12), transparent 60%),
    linear-gradient(180deg,#02110a 0%,#010a06 55%,#000302 100%);
}
/* fine noise + vignette */
.poster::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 40%, transparent 55%, rgba(0,0,0,.75) 100%);z-index:50}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;z-index:49;pointer-events:none}

/* ---------- light streaks ---------- */
svg.streaks{position:absolute;inset:0;z-index:1}

/* ---------- floor ---------- */
.floor{position:absolute;left:-10%;right:-10%;bottom:0;height:200px;z-index:2;
  perspective:500px;perspective-origin:50% 0%;overflow:hidden}
.floor .grid{position:absolute;left:0;right:0;top:0;height:900px;transform:rotateX(74deg);transform-origin:50% 0;
  background:
    repeating-linear-gradient(90deg, rgba(60,255,140,.20) 0 1px, transparent 1px 70px),
    repeating-linear-gradient(0deg, rgba(60,255,140,.16) 0 1px, transparent 1px 70px);
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
          mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%)}
.horizon{position:absolute;left:0;right:0;bottom:198px;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent 0%,rgba(120,255,170,.0) 5%,rgba(150,255,190,.9) 35%,#eafff0 55%,rgba(150,255,190,.9) 75%,transparent 100%);
  box-shadow:0 0 12px 2px rgba(57,255,136,.7),0 0 40px 8px rgba(22,216,100,.35)}
.horizon-haze{position:absolute;left:0;right:0;bottom:80px;height:240px;z-index:2;
  background:radial-gradient(60% 50% at 55% 50%, rgba(40,255,130,.22), transparent 70%)}

/* ---------- particles ---------- */
.p{position:absolute;border-radius:50%;background:#caffdd;z-index:3;
  box-shadow:0 0 6px 1px rgba(80,255,150,.9),0 0 16px 4px rgba(22,216,100,.45)}

/* ---------- logo ---------- */
.logo-wrap{position:absolute;left:50%;top:62px;width:340px;height:340px;transform:translateX(-50%);z-index:10}
.logo-wrap .halo{position:absolute;inset:-150px;border-radius:50%;
  background:radial-gradient(circle, rgba(57,255,136,.42) 0%, rgba(22,216,100,.18) 34%, transparent 62%)}
.logo-wrap img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
  filter:drop-shadow(0 0 10px rgba(57,255,136,.9)) drop-shadow(0 0 28px rgba(22,216,100,.6)) saturate(1.08) contrast(1.04)}
.ring{position:absolute;border-radius:50%}
.ring.r1{inset:-16px;border:2.5px solid #bfffd6;
  box-shadow:0 0 6px #7dffb0,0 0 16px var(--neon),0 0 34px var(--neon-2),inset 0 0 8px #7dffb0,inset 0 0 20px rgba(57,255,136,.6)}
.ring.r2{inset:-34px;border:1px solid rgba(120,255,170,.35)}
.ring.arc{inset:-34px;
  background:conic-gradient(from 210deg, transparent 0deg, rgba(210,255,225,.0) 10deg, #eafff0 38deg, rgba(57,255,136,.9) 60deg, transparent 90deg,
                           transparent 180deg, rgba(57,255,136,.0) 190deg, #eafff0 222deg, rgba(57,255,136,.9) 240deg, transparent 270deg);
  -webkit-mask:radial-gradient(circle, transparent calc(50% - 3px), #000 calc(50% - 2.5px), #000 50%, transparent calc(50% + .5px));
          mask:radial-gradient(circle, transparent calc(50% - 3px), #000 calc(50% - 2.5px), #000 50%, transparent calc(50% + .5px));
  filter:drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 14px var(--neon-2))}
.ring.ticks{inset:-52px;
  background:repeating-conic-gradient(from 0deg, rgba(140,255,185,.45) 0deg .5deg, transparent .5deg 6deg);
  -webkit-mask:radial-gradient(circle, transparent calc(50% - 7px), #000 calc(50% - 7px), #000 50%, transparent 50%);
          mask:radial-gradient(circle, transparent calc(50% - 7px), #000 calc(50% - 7px), #000 50%, transparent 50%);
  opacity:.8}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px #fff,0 0 14px var(--neon),0 0 30px var(--neon-2)}

/* ---------- neon text ---------- */
.neon-white{color:#f6fff9;
  text-shadow:0 0 1px #fff,0 0 6px rgba(200,255,220,.95),0 0 14px rgba(57,255,136,.95),0 0 28px rgba(22,216,100,.85),0 0 56px rgba(10,154,69,.8),0 0 90px rgba(10,154,69,.55)}
.neon-green{color:#aaffc8;
  text-shadow:0 0 2px #e6fff0,0 0 8px rgba(57,255,136,1),0 0 20px rgba(22,216,100,.95),0 0 42px rgba(10,154,69,.9),0 0 80px rgba(10,154,69,.6)}

.title{position:absolute;top:474px;left:0;right:0;text-align:center;z-index:12;
  font-weight:800;font-size:54px;line-height:1.35;letter-spacing:0;white-space:nowrap}
.eyebrow{position:absolute;top:440px;left:0;right:0;z-index:12;display:flex;justify-content:center;align-items:center;gap:14px;
  direction:ltr;font-family:Outfit,sans-serif;font-size:15px;letter-spacing:.42em;color:rgba(200,255,220,.75);text-transform:uppercase}
.eyebrow i{display:block;width:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(160,255,200,.8))}
.eyebrow i:last-child{background:linear-gradient(270deg,transparent,rgba(160,255,200,.8))}

.divider{position:absolute;top:572px;left:50%;width:560px;height:14px;transform:translateX(-50%);z-index:12}
.divider::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#7dffb0 30%,#f0fff5 50%,#7dffb0 70%,transparent);
  box-shadow:0 0 10px var(--neon),0 0 24px var(--neon-2)}
.divider::after{content:"";position:absolute;left:50%;top:1px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);
  background:#f0fff5;box-shadow:0 0 8px #fff,0 0 18px var(--neon),0 0 36px var(--neon-2)}

.subtitle{position:absolute;top:610px;left:0;right:0;text-align:center;z-index:12;
  font-weight:600;font-size:33px;line-height:1.6}

/* ---------- CTA column ---------- */
.cta{position:absolute;left:54px;top:790px;width:566px;z-index:12;direction:rtl}
.cta-label{font-size:21px;font-weight:600;color:rgba(210,255,225,.85);text-align:center;margin-bottom:22px;
  text-shadow:0 0 12px rgba(57,255,136,.45)}
.url{position:relative;display:flex;align-items:center;gap:18px;direction:ltr;height:92px;padding:0 26px 0 20px;
  border-radius:46px;
  background:linear-gradient(180deg,rgba(10,40,22,.72),rgba(3,18,10,.72));
  border:2.5px solid #c8ffdc;
  box-shadow:0 0 6px #9dffc2,0 0 16px var(--neon),0 0 38px rgba(22,216,100,.8),0 0 80px rgba(10,154,69,.45),
             inset 0 0 10px rgba(57,255,136,.55),inset 0 0 30px rgba(22,216,100,.25)}
.url .ic{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(120,255,170,.35),rgba(10,60,30,.6));
  box-shadow:inset 0 0 0 1.5px rgba(170,255,200,.8),0 0 14px rgba(57,255,136,.6)}
.url .txt{flex:1;font-family:Outfit,sans-serif;font-weight:500;font-size:23.5px;letter-spacing:0;white-space:nowrap}
.url .txt b{font-weight:600}
.url svg{display:block}
.url .arrow{flex:none;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px var(--neon))}

.qr-row{display:flex;direction:rtl;align-items:center;gap:26px;margin-top:40px;padding-right:6px}
.qr{position:relative;flex:none;width:162px;height:162px;padding:14px;border-radius:20px;
  background:linear-gradient(160deg,#f4fff8,#d8f7e3);
  box-shadow:0 0 14px rgba(57,255,136,.55),0 0 40px rgba(22,216,100,.35),0 20px 40px rgba(0,0,0,.45)}
.qr img{width:100%;height:100%;display:block}
.qr .c{position:absolute;width:34px;height:34px;border:3px solid #d8ffe6;
  filter:drop-shadow(0 0 4px var(--neon)) drop-shadow(0 0 10px var(--neon-2))}
.qr .c.tl{top:-11px;left:-11px;border-right:0;border-bottom:0;border-top-left-radius:22px}
.qr .c.tr{top:-11px;right:-11px;border-left:0;border-bottom:0;border-top-right-radius:22px}
.qr .c.bl{bottom:-11px;left:-11px;border-right:0;border-top:0;border-bottom-left-radius:22px}
.qr .c.br{bottom:-11px;right:-11px;border-left:0;border-top:0;border-bottom-right-radius:22px}
.qr-text{font-size:21px;font-weight:700;line-height:1.6;white-space:nowrap}
.qr-text small{display:block;font-size:15px;font-weight:500;color:rgba(200,255,220,.7);text-shadow:none;margin-top:4px}

/* ---------- phone ---------- */
.phone-stage{position:absolute;left:700px;top:716px;width:300px;height:620px;z-index:11;perspective:1800px}
.phone-glow{position:absolute;left:600px;top:1150px;width:500px;height:170px;z-index:4;border-radius:50%;
  background:radial-gradient(closest-side, rgba(57,255,136,.55), rgba(22,216,100,.2) 55%, transparent);filter:blur(8px)}
.phone{position:absolute;left:0;top:0;width:262px;height:560px;border-radius:46px;
  transform:rotateY(-20deg) rotateX(6deg) rotateZ(13deg);transform-style:preserve-3d;
  background:linear-gradient(135deg,#6f8f74 0%,#2a3f2e 18%,#163020 45%,#3f6247 75%,#9dc3a4 100%);
  box-shadow:
    0 0 0 1px rgba(210,255,220,.35),
    0 0 18px rgba(57,255,136,.55),
    0 0 50px rgba(22,216,100,.35),
    -30px 50px 70px rgba(0,0,0,.7)}
.phone::before{content:"";position:absolute;inset:3px;border-radius:43px;
  background:linear-gradient(135deg,#2c4531,#0d1a11 40%,#1d3423);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.screen{position:absolute;inset:10px;border-radius:37px;overflow:hidden;background:#000;
  box-shadow:inset 0 0 0 2px #000}
.screen img{position:absolute;left:0;top:26px;width:100%;height:auto;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 6%,#000 92%,transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0,#000 6%,#000 92%,transparent 100%)}
.island{position:absolute;top:16px;left:50%;width:80px;height:23px;border-radius:14px;background:#000;transform:translateX(-50%);z-index:2;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.status{position:absolute;top:18px;left:26px;right:26px;display:flex;justify-content:space-between;direction:ltr;
  font-family:Outfit,sans-serif;font-size:13px;font-weight:600;color:#e8ffef;z-index:2}
.glare{position:absolute;inset:0;border-radius:37px;z-index:3;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 22%,transparent 38%,transparent 70%,rgba(120,255,170,.07) 100%)}
.btn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#9dc3a4,#3f6247)}

/* ---------- footer ---------- */
.footer{position:absolute;left:58px;bottom:54px;width:520px;z-index:12}
.footer .bar{height:2px;margin-bottom:22px;border-radius:2px;
  background:linear-gradient(90deg,#f0fff5,#7dffb0 40%,rgba(57,255,136,.0));
  box-shadow:0 0 8px var(--neon),0 0 20px var(--neon-2)}
.footer .t{font-size:24px;font-weight:700;text-align:left;direction:rtl;white-space:nowrap}
.footer .t span{display:inline-block}
</style>
</head>
<body>
<div class="poster" id="poster">

  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <svg class="streaks" width="1080" height="1350" viewBox="0 0 1080 1350" direction="ltr">
    <defs>
      <linearGradient id="s1" x1="0" x2="1">
        <stop offset="0" stop-color="#b8ff5a" stop-opacity="0"/>
        <stop offset=".25" stop-color="#b8ff5a" stop-opacity=".9"/>
        <stop offset=".6" stop-color="#39ff88" stop-opacity=".8"/>
        <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="s2" x1="0" x2="1">
        <stop offset="0" stop-color="#39ff88" stop-opacity="0"/>
        <stop offset=".45" stop-color="#eafff0" stop-opacity=".95"/>
        <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
        <feGaussianBlur stdDeviation="3" result="a"/>
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feGaussianBlur stdDeviation="24" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#glow)" fill="none" stroke-linecap="round">
      <path d="M -60 1190 C 260 1120, 560 1000, 1140 700" stroke="url(#s1)" stroke-width="2.6"/>
      <path d="M -60 760 C 240 730, 520 745, 1140 650" stroke="url(#s2)" stroke-width="1.3" opacity=".5"/>
      <path d="M 560 -40 C 760 120, 900 300, 1140 380" stroke="url(#s2)" stroke-width="1.4" opacity=".45"/>
      <path d="M -60 330 C 120 250, 250 150, 380 -40" stroke="url(#s1)" stroke-width="1.4" opacity=".45"/>
    </g>
  </svg>

  <div class="horizon-haze"></div>
  <div class="floor"><div class="grid"></div></div>
  <div class="horizon"></div>
  <div id="particles"></div>

  <div class="logo-wrap">
    <div class="halo"></div>
    <div class="ring ticks"></div>
    <div class="ring r2"></div>
    <div class="ring arc"></div>
    <div class="ring r1"></div>
    <img src="logo.png" alt="">
    <div class="dot" style="left:calc(50% + 204px * cos(-35deg) - 4.5px);top:calc(50% + 204px * sin(-35deg) - 4.5px)"></div>
    <div class="dot" style="left:calc(50% + 204px * cos(145deg) - 4.5px);top:calc(50% + 204px * sin(145deg) - 4.5px)"></div>
  </div>

  <div class="eyebrow"><i></i>PUK&nbsp;·&nbsp;Sports&nbsp;Board<i></i></div>
  <h1 class="title neon-white">بۆردی وەرزشی یەکێتیی نیشتمانیی کوردستان</h1>
  <div class="divider"></div>
  <p class="subtitle neon-green">دەرگا بە ڕووی خاوەن بیرۆکە و پڕۆژەکاندا<br>واڵا دەکات</p>

  <div class="cta">
    <div class="url">
      <div class="ic">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#effff4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px #7dffb0)">
          <circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4"/><path d="M12 2.8c2.6 2.6 3.9 5.6 3.9 9.2s-1.3 6.6-3.9 9.2c-2.6-2.6-3.9-5.6-3.9-9.2S9.4 5.4 12 2.8z"/>
        </svg>
      </div>
      <div class="txt neon-white">https://<b>puk-sports-board</b>.pages.dev/</div>
      <svg class="arrow" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f3fff7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6"/><path d="M8.5 6H18v9.5"/></svg>
    </div>

    <div class="qr-row">
      <div class="qr">
        <img src="qr.svg" alt="">
        <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      </div>
      <div class="qr-text neon-green">فۆڕمی پێشکەشکردنی پڕۆژە
        <small>کۆدەکە سکان بکە و بیرۆکەکەت بنێرە</small>
      </div>
    </div>
  </div>

  <div class="phone-glow"></div>
  <div class="phone-stage">
    <div class="phone">
      <div class="btn" style="left:-3px;top:112px;height:30px"></div>
      <div class="btn" style="left:-3px;top:158px;height:50px"></div>
      <div class="btn" style="left:-3px;top:218px;height:50px"></div>
      <div class="btn" style="right:-3px;top:176px;height:80px"></div>
      <div class="screen">
        <img src="screen_crop.png" alt="">
        <div class="island"></div>
        <div class="status"><span>9:41</span><span>●●● ▮</span></div>
        <div class="glare"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="bar"></div>
    <div class="t neon-white"><span>بۆردی وەرزشی یەکێتیی نیشتمانیی کوردستان</span></div>
  </div>
</div>

<script>
document.fonts.ready.then(()=>{for(const [sel,max] of [[".title",980],[".footer .t span",520]]){const e=document.querySelector(sel);let f=parseFloat(getComputedStyle(e).fontSize);const w=()=>e.tagName==="SPAN"?e.getBoundingClientRect().width:(()=>{const r=document.createRange();r.selectNodeContents(e);return r.getBoundingClientRect().width})();while(w()>max&&f>10){f-=1;e.style.fontSize=f+"px"}}});
(function(){
  let s=7;const r=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
  const host=document.getElementById('particles');
  for(let i=0;i<46;i++){
    const d=document.createElement('i');d.className='p';
    const x=r()*1080, y=r()*1350;
    if(x>350&&x<730&&y>40&&y<440) {i--;continue;}
    const z=r()<.8?1+r()*2:3+r()*2.5;
    Object.assign(d.style,{left:x+'px',top:y+'px',width:z+'px',height:z+'px',opacity:(.25+r()*.65).toFixed(2)});
    host.appendChild(d);
  }
})();
</script>
</body>
</html>
